<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap');
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        .app{min-height:100vh;background:#f0f4f8;font-family:'Noto Sans TC',sans-serif;color:#1a2332;transition:background .3s,color .3s}

        /* ── THEME TOGGLE BUTTON ── */
        .theme-btn{margin-left:auto;padding:5px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;transition:all .15s;white-space:nowrap}
        .theme-btn:hover{background:rgba(255,255,255,.28)}

        /* ── HEADER ── */
        header{background:linear-gradient(135deg,#1e3a5f,#2d5986);padding:14px 20px 0;box-shadow:0 3px 12px rgba(0,0,0,.2);transition:background .3s}
        .hi{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 0 6px}
        .ti{font-size:22px} h1{color:#fff;font-size:19px;font-weight:900;letter-spacing:2px}
        .sub{color:#a8cdf0;font-size:12px;letter-spacing:1px}
        .sync-msg{margin-left:auto;font-size:12px;color:#a5d6a7;font-weight:600}
        .nav-bar{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:5px;padding:5px 0 6px;flex-wrap:nowrap}

        /* ── STORAGE STATUS BAR ── */
        .stor-bar{display:flex;align-items:center;gap:8px;padding:4px 14px;font-size:11px;font-weight:600;flex-wrap:wrap;transition:background .3s}
        .stor-init  { background:rgba(255,255,255,.08); color:#90a4ae }
        .stor-checking { background:rgba(255,220,80,.15); color:#ffe082 }
        .stor-ok    { background:rgba(76,175,128,.18); color:#a5d6a7 }
        .stor-saved { background:rgba(76,175,128,.3);  color:#c8f5e0 }
        .stor-saving{ background:rgba(100,160,255,.18);color:#90caf9 }
        .stor-error { background:rgba(244,67,54,.2);   color:#ef9a9a }
        .stor-msg   { white-space:nowrap }
        .stor-detail{ opacity:.75; font-weight:400; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:400px }
        .back-btn{background:rgba(255,255,255,.15);border:none;color:#c8dff5;padding:5px 9px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;transition:background .15s;white-space:nowrap;flex-shrink:0}
        .back-btn:hover{background:rgba(255,255,255,.25)}
        .nav-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
        .nav-btn:hover{background:rgba(255,255,255,.25)}
        .month-label{color:#fff;font-size:14px;font-weight:800;letter-spacing:1px;min-width:80px;text-align:center;flex-shrink:0}
        .date-label{color:#a8cdf0;font-size:11px;font-weight:600;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .undo-btns{display:flex;gap:3px;flex-shrink:0}
        .undo-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
        .undo-btn:hover:not(:disabled){background:rgba(255,255,255,.28)}
        .undo-btn:disabled{opacity:.3;cursor:default}

        main{max-width:960px;margin:20px auto;padding:0 14px}
        .loading{text-align:center;color:#6a8aaa;padding:30px;font-size:14px}

        /* ── 雲端同步列 ── */
        .excel-bar{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 0 12px;flex-wrap:wrap}
        .excel-btn{display:inline-flex;align-items:center;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:opacity .15s;white-space:nowrap}

        .diag-btn{background:rgba(255,255,255,.15);color:#fff}
        .diag-btn:hover{background:rgba(255,255,255,.25)}


        .backup-btn{background:rgba(76,175,128,.55);color:#fff;font-size:12px}
        .backup-btn:hover{background:rgba(76,175,128,.8)}
        .day-backup-btn{display:block;width:calc(100% - 0px);margin:16px 0 0;padding:14px;background:#4caf80;color:#fff;border:none;border-radius:16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center;box-shadow:0 4px 12px rgba(76,175,128,.3);transition:opacity .15s}
        .day-backup-btn:hover{opacity:.88}
        [data-theme="nerv"] .day-backup-btn{background:transparent;border:1px solid #ffcc00;color:#ffcc00;border-radius:4px;font-family:'Share Tech Mono',monospace;letter-spacing:2px;box-shadow:0 0 10px rgba(255,204,0,.2)}
        .import-btn2{background:rgba(255,152,0,.55);color:#fff;font-size:12px}
        .import-btn2:hover{background:rgba(255,152,0,.8)}


        /* ══════════════════════════════════════════
           NERV THEME — MAGI SYSTEM HUD
        ══════════════════════════════════════════ */
                        @keyframes pulse-glow{0%,100%{box-shadow:0 0 8px rgba(255,102,0,.4)}50%{box-shadow:0 0 18px rgba(255,102,0,.8)}}

        [data-theme="nerv"]{background:#050200;color:#ff6600;font-family:"Share Tech Mono","Noto Sans TC",monospace}
        [data-theme="nerv"]::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;z-index:9999}

        [data-theme="nerv"] h1{color:#ff6600;text-shadow:0 0 10px rgba(255,102,0,.9),0 0 30px rgba(255,102,0,.4);letter-spacing:5px;font-family:"Share Tech Mono",monospace;font-size:17px}
        [data-theme="nerv"] .sub{color:#ff4400;letter-spacing:4px;font-size:10px;opacity:.8}
        [data-theme="nerv"] .ti{color:#ff6600;text-shadow:0 0 10px rgba(255,102,0,.8)}
        [data-theme="nerv"] .theme-btn{background:rgba(255,102,0,.1);color:#ff6600;border:1px solid rgba(255,102,0,.5);border-radius:2px;letter-spacing:1px;font-size:11px;box-shadow:0 0 8px rgba(255,102,0,.2)}

        [data-theme="nerv"] .nav-bar{border-top:1px solid rgba(255,102,0,.2)}
        [data-theme="nerv"] .back-btn,[data-theme="nerv"] .nav-btn,[data-theme="nerv"] .undo-btn{background:rgba(255,102,0,.08);color:#ff6600;border:1px solid rgba(255,102,0,.35);border-radius:2px;font-family:"Share Tech Mono",monospace;display:inline-flex!important;visibility:visible!important}

        [data-theme="nerv"] .month-label{color:#ff6600;text-shadow:0 0 8px rgba(255,102,0,.6);letter-spacing:3px}
        [data-theme="nerv"] .date-label{color:#ff4400;letter-spacing:2px}
        [data-theme="nerv"] .excel-bar{border-top:1px solid rgba(255,102,0,.15)}
        [data-theme="nerv"]
        [data-theme="nerv"]

        [data-theme="nerv"] .month-summary{background:#080200;border:1px solid rgba(255,102,0,.4);border-radius:4px}

<script>
// ── Google Drive ──────────────────────────────────────────────────────────────
const CLIENT_ID = '587833882314-pp9ig9k5of9cnbk1aek44lferujlpcs7.apps.googleusercontent.com';
const DRIVE_FILENAME = 'hw-5renren-ALL.json'; // legacy
function getDriveFilename(year, cls) {
  if (!year && !cls) return DRIVE_FILENAME;
  const safe = (cls||'').replace(/\s/g,'').slice(0,10);
  return `hw-${year||'unknown'}-${safe||'class'}.json`;
}
let accessToken = null, driveFileId = null;

function gSignIn(){
  return new Promise((res,rej)=>{
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (resp)=>{
        if(resp.error){rej(resp.error);return;}
        accessToken=resp.access_token;
        localStorage.setItem('hw5ren:tok',accessToken);
        res(accessToken);
      }
    });
    client.requestAccessToken();
  });
}

async function findDriveFile(){
  if(!accessToken)return null;
  const activeName = getDriveFilename(localStorage.getItem('hw5ren:year'), localStorage.getItem('hw5ren:className'));
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${activeName}'&fields=files(id)`,{headers:{'Authorization':'Bearer '+accessToken}});
  const d=await r.json();
  if(d.files?.length){driveFileId=d.files[0].id;return driveFileId;}
  return null;
}

async function saveDrive(snapshot){
  if(!accessToken)throw new Error('未登入');
  const blob=new Blob([JSON.stringify(snapshot)],{type:'application/json'});
  if(!driveFileId)await findDriveFile();
  const form=new FormData();
  if(driveFileId){
    form.append('metadata',new Blob([JSON.stringify({name:getDriveFilename(localStorage.getItem("hw5ren:year"),localStorage.getItem("hw5ren:className"))})],{type:'application/json'}));
    form.append('file',blob);
    const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`,{method:'PATCH',headers:{'Authorization':'Bearer '+accessToken},body:form});
    return r.ok;
  }else{
    form.append('metadata',new Blob([JSON.stringify({name:DRIVE_FILENAME,mimeType:'application/json'})],{type:'application/json'}));
    form.append('file',blob);
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+accessToken},body:form});
    if(r.ok){const d=await r.json();driveFileId=d.id;return true;}
    return false;
  }
}

async function loadDrive(){
  const stored=localStorage.getItem('hw5ren:tok');
  if(stored)accessToken=stored;
  if(!accessToken)return null;
  const fid=await findDriveFile();
  if(!fid)return null;
  const r=await fetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,{headers:{'Authorization':'Bearer '+accessToken}});
  if(r.ok)return r.json();
  // token expired - clear it
  if(r.status===401){accessToken=null;localStorage.removeItem('hw5ren:tok');}
  return null;
}
</script>

// ── Storage ──────────────────────────────────────────────────────────────────
const LS_PREFIX = "hw5ren:";  // localStorage key prefix

// ── IndexedDB 持久儲存（iPhone 跨版本可靠）────────────────────────────────
const DB_NAME  = "hw5ren_db";
const DB_STORE = "dayData";
let _db = null;

function openDB() {
  // 若 _db 存在且連線未關閉，直接回傳
  if (_db) {
    try {
      // 嘗試用它，若已關閉會拋出錯誤
      _db.transaction(DB_STORE, "readonly").abort();
      return Promise.resolve(_db);
    } catch { _db = null; }
  }
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => { e.target.result.createObjectStore(DB_STORE); };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbSet(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror    = e => reject(e.target.error);
  });
}

async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = e => resolve(e.target.result ?? null);
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbKeys() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).getAllKeys();
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

// ── Counseling load / save ───────────────────────────────────────────────────
async function loadCounsel(dateStr) {
  let raw = null;
  try { raw = await idbGet(`counsel:${dateStr}`); } catch {}
  if (!raw) { try { raw = localStorage.getItem(`hw5ren:c:${dateStr}`); } catch {} }
  if (raw) { try { return JSON.parse(raw); } catch {} }
  return [];
}
async function saveCounsel(dateStr, records) {
  const json = JSON.stringify(records);
  try { await idbSet(`counsel:${dateStr}`, json); } catch {}
  try { localStorage.setItem(`hw5ren:c:${dateStr}`, json); } catch {}
}
async function loadCounselMonth(y, m) {
  const entries = {};
  for (let d = 1; d <= new Date(y,m+1,0).getDate(); d++) {
    const ds = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const recs = await loadCounsel(ds);
    if (recs.length > 0) entries[ds] = recs;
  }
  return entries;
}

// ── Day load / save ──────────────────────────────────────────────────────────
async function loadDay(dateStr) {
  let raw = null;
  // 1. IndexedDB（主要，跨版本）
  try { raw = await idbGet(`day:${dateStr}`); } catch {}
  // 2. localStorage 備援
  if (!raw) { try { raw = localStorage.getItem(`hw5ren:${dateStr}`); } catch {} }
  if (raw) {
    try { const d = deser(JSON.parse(raw)); return { ok:true, rows:d.rows, attendance:d.attendance, exempt:d.exempt }; } catch {}
  }
  return { ok:true, rows:[], attendance:{ personal:new Set(), sick:new Set(), public:new Set() }, exempt:{} };
}

async function saveDay(dateStr, rows, attendance, exempt) {
  const json = JSON.stringify(ser(rows, attendance, exempt));
  // 1. IndexedDB（主要）
  let idbOk = false;
  try { idbOk = await idbSet(`day:${dateStr}`, json); } catch {}
  // 2. localStorage（備援）
  try { localStorage.setItem(`hw5ren:${dateStr}`, json); } catch {}
    return { ok: true, source: idbOk ? "idb" : "local" };
}

async function loadMonth(y, m) {
  const days = daysInMonth(y, m);
  const entries = {};
  for (let d = 1; d <= days; d++) {
    const ds = toDateStr(y, m, d);
    const res = await loadDay(ds);
    entries[ds] = { rows: res.rows, attendance: res.attendance, exempt: res.exempt };
  }
  return entries;
}

// ── serialise / deserialise ──────────────────────────────────────────────────
function ser(rows, attendance, exempt) {
  return {
    rows: rows.map(r => ({
      hwName: r.hwName,
      groupData: Object.fromEntries(
        Object.entries(r.groupData).map(([k,v]) => [k, [...v]])
      ),
    })),
    attendance: {
      personal: [...(attendance?.personal ?? [])],
      sick:     [...(attendance?.sick     ?? [])],
      public:   [...(attendance?.public   ?? [])],
    },
    exempt: Object.fromEntries(
      Object.entries(exempt ?? {}).map(([hw, nums]) => [hw, [...nums]])
    ),
  };
}
function deser(data) {
  try {
    const raw = Array.isArray(data) ? { rows: data, attendance: {}, exempt: {} } : (data || { rows: [], attendance: {}, exempt: {} });
    return {
      rows: (raw.rows||[]).map(r => ({
        hwName: r.hwName || "",
        groupData: Object.fromEntries(
          Object.entries(r.groupData||{}).map(([k,v]) => [k, new Set(Array.isArray(v)?v:[])])
        ),
      })),
      attendance: {
        personal: new Set(Array.isArray(raw.attendance?.personal)?raw.attendance.personal:[]),
        sick:     new Set(Array.isArray(raw.attendance?.sick)?raw.attendance.sick:[]),
        public:   new Set(Array.isArray(raw.attendance?.public)?raw.attendance.public:[]),
      },
      exempt: Object.fromEntries(
        Object.entries(raw.exempt ?? {}).map(([hw, nums]) => [hw, new Set(Array.isArray(nums)?nums:[])])
      ),
    };
  } catch(e) {
    console.error('deser error:', e);
    return { rows:[], attendance:{personal:new Set(),sick:new Set(),public:new Set()}, exempt:{} };
  }
}

// ── Date helpers ─────────────────────────────────────────────────────────────
function toDateStr(y, m, d) {
  return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function today() {
  const d = new Date();
  return toDateStr(d.getFullYear(), d.getMonth(), d.getDate());
}
function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function firstWeekday(y, m) { return new Date(y, m, 1).getDay(); }

// ── Mini summary ──────────────────────────────────────────────────────────────
function daySummary(rows, grps) {
  try {
    const filled = rows.filter(r => r.hwName).length;
    const allDone = rows.filter(r => {
      if (!r.hwName) return false;
      return (grps||[]).every(g => {
        const done = r.groupData?.[g.id] ?? new Set();
        return done.size === g.members.length;
      });
    }).length;
    return { filled, allDone };
  } catch { return { filled:0, allDone:0 }; }
}

// ── Counsel View Component ────────────────────────────────────────────────────
function CounselView({ date, records, onSave, onClose, isNerv, allMembers, groups, fmtDate }) {

    return { id: Date.now(), date: ds, period:"", type:"", students:[], summary:"", followup:"" };

  function addRec() {
    const r = newRec(date);
    setRecs(p => [...p, r]);
    setActiveIdx(recs.length);
  }

  function delRec(idx) {
    if (recs.length === 1) { setRecs([newRec(date)]); return; }
    setRecs(p => p.filter((_,i)=>i!==idx));
    setActiveIdx(Math.max(0, idx-1));

    setRecs(p => { const n=[...p]; n[idx]={...n[idx],[field]:val}; return n; });

    setRecs(p => {
      const next=[...p]; const s=new Set(next[idx].students||[]);
      s.has(n)?s.delete(n):s.add(n);
      next[idx]={...next[idx],students:[...s].sort((a,b)=>a-b)};

          {recs.map((r,i)=>
            <button key={i} onClick={()=>setActiveIdx(i)} style={{ padding:"5px 12px",borderRadius:nerv?2:20,border:nerv?"1px solid":"2px solid", borderColor:activeIdx===i?(nerv?"#ff6600":"#1e3a5f"):(nerv?"rgba(255,102,0,.3)":"#dde5ee"), background:activeIdx===i?(nerv?"rgba(255,102,0,.2)":"#1e3a5f"):"transparent", color:activeIdx===i?(nerv?"#ff6600":"#fff"):(nerv?"rgba(255,102,0,.6)":"#8a9db5"), fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:nerv?"Share Tech Mono,monospace":"inherit" }}>
              {nerv?`LOG-${String(i+1).padStart(2,"0")}`:` 紀錄 ${i+1}`}
            </button>
          )}

            {nerv?"+ LOG":"+"}
          </button>
        </div>
      )}

      {/* 表單 */}
      <div style={panel}>
        {/* 節次 */}
        <label style={lbl}>{nerv?"// PERIOD //":"節次"}</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
          {COUNSEL_PERIODS.map(p=>
            <button key={p} onClick={()=>upd(activeIdx,"period",rec.period===p?"":p)}
              style={{padding:"5px 10px",borderRadius:nerv?2:8,border:nerv?"1px solid":"2px solid", borderColor:rec.period===p?(nerv?"#ff6600":"#1e3a5f"):(nerv?"rgba(255,102,0,.3)":"#dde5ee"), background:rec.period===p?(nerv?"rgba(255,102,0,.2)":"#e8f0fe"):"transparent", color:rec.period===p?(nerv?"#ff6600":"#1e3a5f"):(nerv?"rgba(255,102,0,.5)":"#8a9db5"), fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:nerv?"Share Tech Mono,monospace":"inherit" }}>{p}</button>

        <label style={lbl}>{nerv?"// STUDENTS //":"學生座號（可多選）"}</label>
        <div style={{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:4,marginBottom:14}}>
          {allMembers.map(n=>{
            const sel=(rec.students||[]).includes(n);
            const grp=groups.find(g=>g.members.includes(n));
            return (
              <button key={n} onClick={()=>toggleStudent(activeIdx,n)}
                style={{padding:"5px 0",fontSize:11,fontWeight:sel?800:400, border:nerv?"1px solid":"1.5px solid", borderColor:sel?(nerv?"#ff6600":"#1e3a5f"):(nerv?"rgba(255,102,0,.2)":"#dde5ee"), borderRadius:nerv?2:6, background:sel?(nerv?"rgba(255,102,0,.25)":"#e8f0fe"):"transparent", color:sel?(nerv?"#ff6600":"#1e3a5f"):(nerv?"rgba(255,102,0,.4)":"#aaa"), cursor:"pointer",position:"relative", fontFamily:nerv?"Share Tech Mono,monospace":"inherit" }}>

      {/* 刪除本筆 */}

// ── Settings View Component ───────────────────────────────────────────────────
function SettingsView({ groups, saveGroups, className, setClassName, schoolName, setSchoolName, schoolYear, setSchoolYear, onClose, onSaved, isNerv, idbKeys, idbGet, openDB, DB_STORE }) {
  const [draft, setDraft] = useState(() => JSON.parse(JSON.stringify(groups)));
  const [draftClass, setDraftClass] = useState(className);
  const [draftSchool, setDraftSchool] = useState(schoolName);
  const [draftYear, setDraftYear] = useState(schoolYear);
  const [saved, setSaved] = useState(false);
  const [clearModal, setClearModal] = useState(false);
  const [clearDel, setClearDel] = useState("");
  const [clearInput, setClearInput] = useState({
    className: "",
    yearFrom: parseInt(schoolYear)||new Date().getFullYear(),
    yearTo: (parseInt(schoolYear)||new Date().getFullYear())+1
  });
  const [clearMsg, setClearMsg] = useState("");

  // 每次開啟 clearModal 時同步最新的 draftClass
  useEffect(()=>{
    if(clearModal){
      setClearInput(p=>({...p,
        className: draftClass||className||"",
        yearFrom: parseInt(draftYear||schoolYear)||new Date().getFullYear(),
        yearTo: (parseInt(draftYear||schoolYear)||new Date().getFullYear())+1
      }));
      setClearDel("");
      setClearMsg("");
    }
  },[clearModal]);
  const nerv = isNerv;

  // 全班最大座號（自動偵測或預設40）
  const maxSeat = 40;
  const allUsed = draft.flatMap(g => g.members);

  function toggleSeat(idx, n) {
    setDraft(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const g = next[idx];
      if (g.members.includes(n)) {
        g.members = g.members.filter(m => m !== n);
        if (g.leader === n) g.leader = g.members[0] || 0;
        if (g.secretary === n) g.secretary = g.members[1] || g.members[0] || 0;
      } else {
        // 確認沒有在其他組
        const inOther = next.some((og, oi) => oi !== idx && og.members.includes(n));
        if (inOther) return prev; // 不能加入已在其他組的座號
        g.members = [...g.members, n].sort((a,b)=>a-b);
      }
      return next;
    });
  }

  function updateGroup(idx, field, value) {
    setDraft(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      next[idx][field] = value;
      return next;
    });
  }

  function addGroup() {
    if (draft.length >= 8) return;
    const newId = draft.length + 1;
    setDraft(prev => [...prev, { id: newId, label: `第${KANJI_NUM[prev.length]}組`, members: [], leader: 0, secretary: 0 }]);
  }

  function removeGroup(idx) {
    if (draft.length <= 2) return;
    setDraft(prev => prev.filter((_,i)=>i!==idx).map((g,i)=>({...g, id:i+1})));
  }

  function doSave() {
    const valid = draft.every(g => g.members.length > 0);
    if (!valid) { alert("每組至少需要1個座號"); return; }
    saveGroups(draft);
    setClassName(draftClass.trim());
    setSchoolName(draftSchool.trim());
    setSchoolYear(draftYear.trim());
    if (onSaved) onSaved(draftYear.trim(), draftSchool.trim(), draftClass.trim());
    setSaved(true);
    setTimeout(()=>{ setSaved(false); onClose(); }, 1200);
  }

  async function doClear() {
    if (clearDel !== "DEL") { setClearMsg("請輸入正確的 DEL"); return; }
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement('div',{style:{padding:20,background:'#1e3a5f',color:'white',minHeight:'100vh'}},'✅ 前12.5% 成功！'));
