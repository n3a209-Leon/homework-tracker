              const snapshot = {};
              for (const k of allKeys) {
                const v = await idbGet(k);
                if (v) snapshot[k] = v;
              }
              if (raw) snapshot[`day:${selDate}`] = raw;
              if (Object.keys(snapshot).length === 0) {
                setImportMsg("⚠️ 尚無資料可備份");
                setTimeout(()=>setImportMsg(""),3000);
                return;
              }
              const payload = JSON.stringify(snapshot);
              setBackupJson(payload);
              setShowBackup(true);
              markSynced();
              setImportMsg(`✅ ${Object.keys(snapshot).length} 天資料已打包`);
            } catch(e) { setImportMsg("❌ "+String(e).slice(0,40)); }
          }}>
            📤 備份全部到 Drive
          </button>
        </main>
      )}

      {/* ── MODAL ── */}
      {modal&&(
        <div className="ov" onClick={closeModal}>
          <div className="mo" onClick={e=>e.stopPropagation()}>

            {modal.phase==="input"&&(
              <>
                <h2 className="mt">{isNerv ? "◈ INPUT MISSION CODE" : "輸入作業名稱"}</h2>

                {/* 自訂記憶的作業 */}
                {customHW.length > 0 && (
                  <div className="custom-hw-section">
                    <p className="custom-hw-label">{isNerv ? "// MEMORY //" : "記憶"}</p>
                    <div className="pg">
                      {customHW.map(hw=>(
                        <div key={hw} className="preset-wrap">
                          <button className={`pb2 ${pendingHw===hw?"act":""}`}
                            onClick={()=>{setPendingHw(hw);setInputText(hw);}}>
                            {hw}
                          </button>
                          <button className="preset-del" onClick={()=>setCustomHW(p=>p.filter(h=>h!==hw))}>×</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 預設作業 */}
                <p className="custom-hw-label">{isNerv ? "// PRESET //" : "預設"}</p>
                <div className="pg">
                  {PRESET_HW.map(hw=>(
                    <button key={hw} className={`pb2 ${pendingHw===hw?"act":""}`}
                      onClick={()=>{setPendingHw(hw);setInputText(hw);}}>{hw}</button>
                  ))}
                </div>

                <div className="ir">
                  <input className="hi2" value={inputText} placeholder={isNerv?"[ MANUAL INPUT ]":"手動輸入（自動記憶）"}
                    onChange={e=>{setInputText(e.target.value);setPendingHw(e.target.value);}}
                    onKeyDown={e=>e.key==="Enter"&&(modal.gid!==null?handleConfirmInput():null)}
                    autoFocus />
                </div>
                <div className="ma">
                  <button className="bc" onClick={closeModal}>取消</button>
                  <button className="bk" onClick={handleConfirmInput}>確認</button>
                </div>
              </>
            )}

            {modal.phase==="mark"&&(
              <>
                <h2 className="mt">
                  <span className="mh">{modal.hw}</span>
                  <span className="mg">— {isNerv ? <span className="nerv-unit-label"><span className="nerv-unit-kanji">{nervUnit(modal.gid)}</span></span> : groups.find(g=>g.id===modal.gid)?.label}</span>
                </h2>
                {(()=>{
                  const grp = groups.find(g=>g.id===modal.gid);
                  const allSelected = grp?.members.every(n=>marked.has(n));
                  const members = grp?.members || [];

                  // 蜂巢排列：每行交錯偏移，奇數行往右偏半格
                  // 計算每顆六角形的 x/y 位置
                  const HEX_W = 52;   // 六角形寬
                  const HEX_H = 58;   // 六角形高
                  const COLS  = 4;    // 每行幾顆
                  const COL_GAP = 4;
                  const ROW_GAP = -10; // 六角形上下重疊

                  const positions = members.map((n, i) => {
                    const row = Math.floor(i / COLS);
                    const col = i % COLS;
                    const offsetX = row % 2 === 1 ? (HEX_W + COL_GAP) / 2 : 0;
                    const x = col * (HEX_W + COL_GAP) + offsetX;
                    const y = row * (HEX_H + ROW_GAP);
                    return { n, x, y, row, col };
                  });

                  const rows = Math.ceil(members.length / COLS);
                  const containerW = COLS * (HEX_W + COL_GAP) + (HEX_W + COL_GAP) / 2;
                  const containerH = rows * (HEX_H + ROW_GAP) + Math.abs(ROW_GAP) + HEX_H;

                  return (
                    <>
                      <div className="mark-toolbar">
                        <div className="toolbar-btns">
                          <button
                            className={`all-btn ${allSelected?"all-undo":""}`}
                            onClick={()=>{
                              if(allSelected){ setMarked(new Set()); }
                              else { setMarked(new Set(grp.members)); }
                            }}>
                            {allSelected ? "↩ 取消全選" : "✓ 整組全交"}
                          </button>
                          <button className="all-btn all-none" onClick={()=>setMarked(new Set())}>
                            ✗ 整組未交
                          </button>
                        </div>
                        <span className="mark-count">{marked.size} / {grp?.members.length} 人</span>
                      </div>

                      {/* 蜂巢網格 */}
                      <div className={`ng ${isNerv?"ng-hex":""}`}
                        style={isNerv ? { position:"relative", width:containerW, height:containerH, margin:"0 auto 16px" } : {}}>
                        {isNerv ? positions.map(({n, x, y}) => (
                          <div key={n} className="nw"
                            style={{ position:"absolute", left:x, top:y, width:HEX_W, height:HEX_H,
                              transition:`all .15s ${Math.random()*0.1}s` }}>
                            <button
                              className={`nb ${marked.has(n)?"sub":""} ${n===grp.leader?"ldr":""} ${n===grp.secretary?"sec":""}`}
                              style={{ width:"100%", height:"100%" }}
                              onClick={()=>{const s=new Set(marked);s.has(n)?s.delete(n):s.add(n);setMarked(s);}}>
                              {n}
                            </button>
                            {n===grp.leader&&<span className="rt lt" style={{position:"absolute",bottom:-14,left:"50%",transform:"translateX(-50%)",fontSize:9}}>組長</span>}
                            {n===grp.secretary&&<span className="rt st" style={{position:"absolute",bottom:-14,left:"50%",transform:"translateX(-50%)",fontSize:9}}>秘書</span>}
                          </div>
                        )) : members.map(n=>(
                          <div key={n} className="nw">
                            <button
                              className={`nb ${marked.has(n)?"sub":""} ${n===grp.leader?"ldr":""} ${n===grp.secretary?"sec":""}`}
                              onClick={()=>{const s=new Set(marked);s.has(n)?s.delete(n):s.add(n);setMarked(s);}}>
                              {n}
                            </button>
                            {n===grp.leader&&<span className="rt lt">組長</span>}
                            {n===grp.secretary&&<span className="rt st">秘書</span>}
                          </div>
                        ))}
                      </div>
                    </>
                  );
                })()}
                <div className="ma">
                  <button className="bc" onClick={closeModal}>取消</button>
                  <button className="bk" onClick={confirmMark}>完成</button>
                </div>
              </>
            )}

            {modal.phase==="result"&&(
              <>
                <h2 className="mt">
                  <span className="mh">{dayRows[modal.ri]?.hwName}</span>
                  <span className="mg">— {isNerv ? <span className="nerv-unit-label"><span className="nerv-unit-kanji">{nervUnit(resGroup?.id)}</span></span> : resGroup?.label}</span>
                </h2>
                {resMissing.length===0?(
                  <div className="ra">
                    <span className="bc2">{isNerv ? "⬡" : "○"}</span>
                    <p>{isNerv ? "▸ ALL CLEAR — MISSION COMPLETE ◂" : "全組繳交完成！"}</p>
                  </div>
                ):(
                  <div className="rm">
                    <p className="rl">{isNerv ? "⚠ PILOTS NOT REPORTING" : "未繳交"}</p>
                    <div className="mg2">{resMissing.map(n=><span key={n} className="mt2">{isNerv ? String(n).padStart(2,"0") : n}</span>)}</div>
                  </div>
                )}
                <div className="ma"><button className="bk" onClick={closeModal}>關閉</button></div>
              </>
            )}

          </div>
        </div>
      )}


      {/* ── ATTENDANCE MODAL ── */}
      {attModal&&(
        <div className="ov" onClick={closeAttModal}>
          <div className="mo" onClick={e=>e.stopPropagation()}>
            {(()=>{
              const lt = LEAVE_TYPES.find(l=>l.id===attModal.leaveType);
              const otherTypes = LEAVE_TYPES.filter(l=>l.id!==attModal.leaveType);
              return (
                <>
                  <h2 className="mt" style={{color:lt.color}}>{lt.label} 點名</h2>
                  <p className="mhint">點選請{lt.label}的座號（已登記其他假別會自動切換）</p>
                  <div className="ng">
                    {ALL_MEMBERS.map(n=>{
                      const isThis  = dayAtt[lt.id]?.has(n);
                      const otherMatch = otherTypes.find(o=>dayAtt[o.id]?.has(n));
                      return (
                        <div key={n} className="nw">
                          <button
                            className={`nb ${isThis?"att-sel":""} ${otherMatch?"att-other":""}`}
                            style={isThis
                              ? {background:lt.bg,borderColor:lt.color,color:lt.color}
                              : otherMatch
                                ? {background:otherMatch.bg,borderColor:otherMatch.color,color:otherMatch.color}
                                : {}}
                            onClick={()=>toggleAttMember(lt.id, n)}>
                            {n}
                          </button>
                          {isThis      && <span className="role-tag" style={{background:lt.bg,color:lt.color}}>{lt.label}</span>}
                          {otherMatch  && <span className="role-tag" style={{background:otherMatch.bg,color:otherMatch.color}}>{otherMatch.label}</span>}
                        </div>
                      );
                    })}
                  </div>
                  <div className="ma">
                    <button className="bc" onClick={closeAttModal}>關閉</button>
                  </div>
                </>
              );
            })()}
          </div>
        </div>
      )}

      {/* ── 備份 Modal ── */}
      {showBackup && (
        <div className="ov" onClick={()=>setShowBackup(false)}>
          <div className="mo" onClick={e=>e.stopPropagation()}>
            <h2 className="mt" style={{fontSize:15}}>📤 備份資料</h2>
            <p className="mhint">點欄位 → 已全選 → 直接「拷貝」→ 關閉 → 回對話貼上</p>
            <input
              className="backup-input"
              readOnly
              value={backupJson}
              ref={el => { if(el) { el.focus(); el.select(); } }}
              onClick={e=>e.target.select()}
            />
            <p className="mhint" style={{marginTop:6,color:'#f9a825'}}>
              💡 iOS：點欄位 → 全選 → 拷貝
            </p>
            <div className="ma" style={{marginTop:12}}>
              <button className="bk" onClick={()=>setShowBackup(false)}>關閉</button>
            </div>
          </div>
        </div>
      )}

      {/* ── 匯入 Modal ── */}
      {showImport && (
        <div className="ov" onClick={()=>{setShowImport(false);setImportText("");}}>
          <div className="mo" onClick={e=>e.stopPropagation()}>
            <h2 className="mt" style={{fontSize:15}}>📥 匯入資料</h2>
            <p className="mhint">貼上 Claude 給你的 JSON 字串</p>
            <textarea
              className="backup-textarea"
              value={importText}
              onChange={e=>setImportText(e.target.value)}
              placeholder="在此貼上 JSON..."
              rows={6}
            />
            <div className="ma" style={{justifyContent:"flex-start",gap:8}}>
              <button className="bc" onClick={()=>{setShowImport(false);setImportText("");}}>取消</button>
              <button className="bk" onClick={async()=>{
                if(!importText.trim()){return;}
                setImportMsg("⏳ 匯入中…");
                try {
                  const parsed = JSON.parse(importText.trim());
                  let count=0;
                  const importedDates = [];
                  if (parsed.date && parsed.data) {
                    await idbSet(`day:${parsed.date}`, parsed.data);
                    localStorage.setItem(`hw5ren:${parsed.date}`, parsed.data);
                    importedDates.push(parsed.date);
                    count=1;
                  } else {
                    for(const [k,v] of Object.entries(parsed)){
                      if(k.startsWith("day:2")){
                        const ds = k.replace("day:","");
                        await idbSet(`day:${ds}`, v);
                        localStorage.setItem(`hw5ren:${ds}`, v);
                        importedDates.push(ds);
                        count++;
                      }
                    }
                  }
                  if (importedDates.length > 0) {
                    const firstDate = importedDates.sort()[0];
                    const [y, m] = firstDate.split("-").map(Number);
                    setCurYear(y); setCurMonth(m-1);
                    await doLoadMonth(y, m-1);
                  } else {
                    await doLoadMonth(curYear, curMonth);
                  }
                  // 關閉 modal、回月曆、顯示成功
                  setShowImport(false); setImportText("");
                  setView("month");
                  setImportMsg(`✅ 已還原 ${count} 天資料`);
                  setTimeout(()=>setImportMsg(""),5000);
                } catch(e){
                  setImportMsg("❌ 匯入失敗："+String(e).slice(0,60));
                  setTimeout(()=>setImportMsg(""),6000);
                }
              }}>確認匯入</button>
            </div>
          </div>
        </div>
      )}

      {/* ── COUNSEL VIEW ── */}
      {counselView && (
        <CounselView
          date={counselDate}
          records={counselRecords}
          onSave={saveCounselRecord}
          onClose={()=>setCounselView(false)}
          isNerv={isNerv}
          allMembers={ALL_MEMBERS}
          groups={groups}
          fmtDate={fmtDate}
        />
      )}

      {/* ── SETTINGS VIEW ── */}
      {view==="settings" && (
        <SettingsView
          groups={groups}
          saveGroups={saveGroups}
          className={className}
          setClassName={(v)=>{ setClassName(v); localStorage.setItem("hw5ren:className",v); }}
          schoolName={schoolName}
          setSchoolName={(v)=>{ setSchoolName(v); localStorage.setItem("hw5ren:school",v); }}
          schoolYear={schoolYear}
          setSchoolYear={(v)=>{ setSchoolYear(v); localStorage.setItem("hw5ren:year",v); }}
          onClose={()=>setView("month")}
          isNerv={isNerv}
          idbKeys={idbKeys}
          idbGet={idbGet}
          openDB={openDB}
          DB_STORE={DB_STORE}
        />
      )}

    </div>
  );
}

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
});
</script>
</body>
</html>
