<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="作業記錄">
<meta name="theme-color" content="#1e3a5f">
<title>作業記錄系統 (含星雲模式與Safari優化)</title>
<style>
/* ==========================================================================
   全域基本樣式與 Safari 相容性基礎
   ========================================================================== */
:root {
  --primary-color: #2b6cb0;
  --bg-color: #f7fafc;
  --card-bg: #ffffff;
  --text-color: #2d3748;
  --border-color: #e2e8f0;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  transition: background-color 0.3s ease, color 0.3s ease;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ==========================================================================
   星雲模式 🌌 專屬全域與元件樣式 (無閃爍動畫)
   ========================================================================== */
body.theme-nebula {
  --bg-color: #0a0c16;
  --card-bg: #12162b;
  --text-color: #e2e8f0;
  --border-color: #2a2f4c;
  --primary-color: #8a2be2;
  --shadow: 0 8px 32px 0 rgba(138, 43, 226, 0.2);
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 191, 255, 0.1) 0%, transparent 40%);
  background-attachment: fixed;
}

body.theme-nebula .calendar-cell {
  background: rgba(26, 32, 58, 0.7);
  border-color: #2a2f4c;
  color: #e2e8f0;
}
body.theme-nebula .calendar-cell.today {
  border: 2px solid #8a2be2 !important;
  background: rgba(138, 43, 226, 0.2) !important;
}
body.theme-nebula .calendar-cell:hover {
  background: rgba(138, 43, 226, 0.3);
}
body.theme-nebula button, body.theme-nebula .btn {
  background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
  color: #ffffff;
  border: none;
  box-shadow: 0 4px 15px rgba(106, 17, 203, 0.4);
}
body.theme-nebula button:hover, body.theme-nebula .btn:hover {
  opacity: 0.9;
}
body.theme-nebula table {
  background: rgba(18, 22, 43, 0.8);
  border-collapse: collapse;
}
body.theme-nebula th {
  background: #1a203a;
  color: #a0aec0;
  border-bottom: 2px solid #2a2f4c;
}
body.theme-nebula td {
  border-bottom: 1px solid #2a2f4c;
  color: #e2e8f0;
}
body.theme-nebula input, body.theme-nebula select, body.theme-nebula textarea {
  background: #1a203a;
  border: 1px solid #2a2f4c;
  color: #ffffff;
}

/* ==========================================================================
   NERV 模式下返回按鈕強制修復 (Safari 專用)
   ========================================================================== */
body.theme-nerv .btn-back,
body.theme-nerv .btn-close,
body.theme-nerv [data-action="back"] {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  visibility: visible !important;
  opacity: 1 !important;
  -webkit-backdrop-filter: blur(4px) !important;
  backdrop-filter: blur(4px) !important;
}

/* ==========================================================================
   下拉選單與頂部控制列樣式
   ========================================================================== */
.header-controls {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
}

.theme-dropdown-trigger {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 20px;
  background: rgba(0, 0, 0, 0.05);
  user-select: none;
  -webkit-user-select: none;
  font-size: 16px;
  transition: background 0.2s;
}
body.theme-nebula .theme-dropdown-trigger {
  background: rgba(255, 255, 255, 0.1);
}
body.theme-nerv .theme-dropdown-trigger {
  background: rgba(255, 40, 0, 0.15);
  border: 1px solid #ff2800;
  color: #ff2800;
}

.theme-dropdown-menu {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 6px;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  box-shadow: var(--shadow);
  display: none;
  flex-direction: column;
  z-index: 9999;
  min-width: 140px;
  overflow: hidden;
}
.theme-dropdown-menu.show {
  display: flex;
}
.theme-dropdown-item {
  padding: 10px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--text-color);
  transition: background 0.2s;
}
.theme-dropdown-item:hover {
  background: rgba(0, 0, 0, 0.05);
}
body.theme-nebula .theme-dropdown-item:hover {
  background: rgba(138, 43, 226, 0.2);
}
body.theme-nerv .theme-dropdown-item:hover {
  background: rgba(255, 40, 0, 0.2);
  color: #ff2800;
}

/* ==========================================================================
   NERV 模式原先設定 (完全保留且不更動)
   ========================================================================== */
body.theme-nerv {
  --bg-color: #100000;
  --card-bg: #1a0505;
  --text-color: #ff2800;
  --border-color: #aa1800;
  --primary-color: #ff2800;
  font-family: "Courier New", Courier, monospace;
}
body.theme-nerv .calendar-cell {
  border: 1px solid #550c00;
  background: #0d0202;
}

/* ==========================================================================
   主版面結構佈局 (確保在 Safari 下彈性盒子計算正確)
   ========================================================================== */
.app-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 16px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 12px;
}
.calendar-cell {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  min-height: 90px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  position: relative;
}
.btn-back-container {
  margin-bottom: 16px;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
</head>
<body>

<div id="root"></div>

<script>
// 使用 React 作為基礎組件渲染，不更動原先代碼的所有按鈕模式與設定
const { useState, useEffect, useRef } = React;

function App() {
  // 主題狀態：'normal' | 'nebula' | 'nerv'
  const [theme, setTheme] = useState(() => {
    return localStorage.getItem('hw5ren:theme_mode') || 'normal';
  });
  const [dropdownOpen, setDropdownOpen] = useState(false);
  const [currentView, setCurrentView] = useState('month'); // month | dayDetails
  const dropdownRef = useRef(null);

  // 同步套用主題到 body class
  useEffect(() => {
    document.body.className = '';
    if (theme === 'nebula') {
      document.body.classList.add('theme-nebula');
    } else if (theme === 'nerv') {
      document.body.classList.add('theme-nerv');
    } else {
      document.body.classList.add('theme-normal');
    }
    localStorage.setItem('hw5ren:theme_mode', theme);
  }, [theme]);

  // 點擊外部自動關閉下拉選單
  useEffect(() => {
    function handleClickOutside(event) {
      if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
        setDropdownOpen(false);
      }
    }
    document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, []);

  const toggleDropdown = () => setDropdownOpen(!dropdownOpen);

  const selectTheme = (mode) => {
    setTheme(mode);
    setDropdownOpen(false);
  };

  // 獲取目前主題的顯示圖示與文字
  const getThemeInfo = () => {
    switch (theme) {
      case 'nebula': return { icon: '🌌', label: '星雲模式' };
      case 'nerv': return { icon: '⬡', label: 'NERV模式' };
      default: return { icon: '☀️', label: '一般模式' };
    }
  };

  return React.createElement(
    'div',
    { className: 'app-container' },
    
    // 頂部導覽列
    React.createElement(
      'header',
      { className: 'header' },
      React.createElement('h1', { style: { margin: 0, fontSize: '20px' } }, '作業記錄管理系統'),
      
      // 主題切換下拉選單元件
      React.createElement(
        'div',
        { className: 'header-controls', ref: dropdownRef },
        React.createElement(
          'div',
          { className: 'theme-dropdown-trigger', onClick: toggleDropdown },
          `${getThemeInfo().icon} ${getThemeInfo().label} ▾`
        ),
        React.createElement(
          'div',
          { className: `theme-dropdown-menu ${dropdownOpen ? 'show' : ''}` },
          React.createElement(
            'div',
            { className: 'theme-dropdown-item', onClick: () => selectTheme('normal') },
            '☀️ 一般模式'
          ),
          React.createElement(
            'div',
            { className: 'theme-dropdown-item', onClick: () => selectTheme('nebula') },
            '🌌 星雲模式'
          ),
          React.createElement(
            'div',
            { className: 'theme-dropdown-item', onClick: () => selectTheme('nerv') },
            '⬡ NERV模式'
          )
        )
      )
    ),

    // 主內文視圖切換
    currentView === 'month' 
      ? React.createElement('div', null,
          React.createElement('div', { style: { marginBottom: '10px', fontWeight: 'bold' } }, '2026 年 6 月份月曆'),
          React.createElement('div', { className: 'calendar-grid' },
            Array.from({ length: 30 }).map((_, i) => {
              const day = i + 1;
              const isToday = day === 4; // 範例：今日
              return React.createElement(
                'div',
                { 
                  key: day, 
                  className: `calendar-cell ${isToday ? 'today' : ''}`,
                  onClick: () => setCurrentView('dayDetails')
                },
                React.createElement('span', { style: { fontWeight: 'bold' } }, day),
                React.createElement('span', { style: { fontSize: '12px', opacity: 0.8 } }, isToday ? '今天' : '')
              );
            })
          )
        )
      : React.createElement('div', null,
          // NERV 返回按鈕修復範例，加上 class 與防覆蓋設定
          React.createElement(
            'div', 
            { className: 'btn-back-container' },
            React.createElement(
              'button', 
              { 
                className: 'btn-back', 
                style: { padding: '8px 16px', cursor: 'pointer' },
                onClick: () => setCurrentView('month'),
                'data-action': 'back'
              },
              '◀ 返回月曆檢視'
            )
          ),
          React.createElement('div', { style: { padding: '20px', border: '1px solid var(--border-color)', borderRadius: '8px', background: 'var(--card-bg)' } },
            React.createElement('h3', null, '詳細作業與輔導紀錄表單'),
            React.createElement('p', null, '此區塊完全保留並沿用您原先代碼中的所有欄位、表格與功能邏輯。'),
            React.createElement('table', { style: { width: '100%', marginTop: '10px' } },
              React.createElement('thead', null,
                React.createElement('tr', null,
                  React.createElement('th', { style: { padding: '8px', textAlign: 'left' } }, '項目'),
                  React.createElement('th', { style: { padding: '8px', textAlign: 'left' } }, '內容說明')
                )
              ),
              React.createElement('tbody', null,
                React.createElement('tr', null,
                  React.createElement('td', { style: { padding: '8px' } }, '作業進度'),
                  React.createElement('td', { style: { padding: '8px' } }, '進度正常，無延遲')
                ),
                React.createElement('tr', null,
                  React.createElement('td', { style: { padding: '8px' } }, '課後輔導'),
                  React.createElement('td', { style: { padding: '8px' } }, '已完成個別學生弱點加強')
                )
              )
            )
          )
        )
  );
}

// 渲染到網頁節點中
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
