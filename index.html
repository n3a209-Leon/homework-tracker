<style>

.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;background:linear-gradient(160deg,#1e3a5f,#2d5a8e)}

<body>
<div id="root"><div class="auth-screen"><div class="auth-logo">📋</div><h1 class="auth-title">作業繳交記錄</h1><p class="auth-sub">載入中…</p></div></div>
<script>
const CLIENT_ID='587833882314-pp9ig9k5of9cnbk1aek44lferujlpcs7.apps.googleusercontent.com';
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ── 等所有 script 載入後啟動 ──
window.addEventListener('load', function() {

const GROUPS=[{id:1,label:'第一組',members:[7,9,4,5,26,8],leader:7,secretary:9},{id:2,label:'第二組',members:[25,17,21],leader:25,secretary:17},{id:3,label:'第三組',members:[10,14,2,3,11,12],leader:10,secretary:14},{id:4,label:'第四組',members:[15,27,13,18,22],leader:15,secretary:27},{id:5,label:'第五組',members:[23,19,16,24,1,20],leader:23,secretary:19}];
const PRESET_HW=['國習','數習','國乙','國甲','聽寫','小日記','小作文','作文段落','作文','數習題','國卷','數卷','聯絡簿','回條','國習題'];
const WEEKDAYS=['日','一','二','三','四','五','六'];
const ALL_MEMBERS=[...new Set(GROUPS.flatMap(g=>g.members))].sort((a,b)=>a-b);
const LEAVE_TYPES=[{id:'personal',label:'事假',color:'#f57c00',bg:'#fff3e0'},{id:'sick',label:'病假',color:'#1565c0',bg:'#e3f2fd'},{id:'public',label:'公假',color:'#2e7d32',bg:'#e8f5e9'}];
const MAX_ROWS=6;
const LS='hw5ren:';

// IndexedDB
const DB='hw5ren_db',ST='dayData';let _db=null;
function openDB(){if(_db){try{_db.transaction(ST,'readonly').abort();return Promise.resolve(_db);}catch{_db=null;}}return new Promise((r,j)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=e=>e.target.result.createObjectStore(ST);q.onsuccess=e=>{_db=e.target.result;r(_db);};q.onerror=e=>j(e.target.error);});}
async function idbSet(k,v){const db=await openDB();return new Promise((r,j)=>{const tx=db.transaction(ST,'readwrite');tx.objectStore(ST).put(v,k);tx.oncomplete=()=>r(true);tx.onerror=e=>j(e);});}
async function idbGet(k){const db=await openDB();return new Promise((r,j)=>{const tx=db.transaction(ST,'readonly');const q=tx.objectStore(ST).get(k);q.onsuccess=e=>r(e.target.result??null);q.onerror=e=>j(e);});}
async function idbKeys(){const db=await openDB();return new Promise((r,j)=>{const tx=db.transaction(ST,'readonly');const q=tx.objectStore(ST).getAllKeys();q.onsuccess=e=>r(e.target.result);q.onerror=e=>j(e);});}

// Drive
let token=null,fileId=null;
function signIn(){return new Promise((r,j)=>{const c=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:resp=>{if(resp.error){j(resp.error);return;}token=resp.access_token;localStorage.setItem('hw5ren:tok',token);r(token);}});c.requestAccessToken();});}
async function ensureToken(){if(token)return;const s=localStorage.getItem('hw5ren:tok');if(s)token=s;}
async function findFile(){await ensureToken();if(!token)return null;const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='hw-5renren-ALL.json'&fields=files(id)`,{headers:{'Authorization':'Bearer '+token}});const d=await r.json();if(d.files?.length){fileId=d.files[0].id;return fileId;}return null;}
async function saveDrive(snap){await ensureToken();if(!token)throw new Error('未登入');const b=new Blob([JSON.stringify(snap)],{type:'application/json'});if(!fileId)await findFile();const form=new FormData();if(fileId){form.append('metadata',new Blob([JSON.stringify({name:'hw-5renren-ALL.json'})],{type:'application/json'}));form.append('file',b);const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`,{method:'PATCH',headers:{'Authorization':'Bearer '+token},body:form});return r.ok;}else{form.append('metadata',new Blob([JSON.stringify({name:'hw-5renren-ALL.json',mimeType:'application/json'})],{type:'application/json'}));form.append('file',b);const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+token},body:form});if(r.ok){const d=await r.json();fileId=d.id;return true;}return false;}}
async function loadDrive(){await ensureToken();if(!token)return null;const fid=await findFile();if(!fid)return null;const r=await fetch(`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`,{headers:{'Authorization':'Bearer '+token}});if(r.ok)return r.json();return null;}

// Ser/Deser
function ser(rows,att,ex){return{rows:rows.map(r=>({hwName:r.hwName,groupData:Object.fromEntries(Object.entries(r.groupData).map(([k,v])=>[k,[...v]]))})),attendance:{personal:[...(att?.personal??[])],sick:[...(att?.sick??[])],public:[...(att?.public??[])]},exempt:Object.fromEntries(Object.entries(ex??{}).map(([h,s])=>[h,[...s]]))};}
function deser(data){const raw=Array.isArray(data)?{rows:data,attendance:{},exempt:{}}:(data||{rows:[],attendance:{},exempt:{}});return{rows:(raw.rows||[]).map(r=>({hwName:r.hwName||'',groupData:Object.fromEntries(Object.entries(r.groupData||{}).map(([k,v])=>[k,new Set(v)]))})),attendance:{personal:new Set(raw.attendance?.personal??[]),sick:new Set(raw.attendance?.sick??[]),public:new Set(raw.attendance?.public??[])},exempt:Object.fromEntries(Object.entries(raw.exempt??{}).map(([h,s])=>[h,new Set(s)]))};}
function toDS(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function today(){const n=new Date();return toDS(n.getFullYear(),n.getMonth(),n.getDate());}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function fw(y,m){return new Date(y,m,1).getDay();}
async function loadDay(ds){let raw=null;try{raw=await idbGet('day:'+ds);}catch{}if(!raw)try{raw=localStorage.getItem(LS+ds);}catch{}if(raw)try{const d=deser(JSON.parse(raw));return{rows:d.rows,att:d.attendance,ex:d.exempt};}catch{}return{rows:[],att:{personal:new Set(),sick:new Set(),public:new Set()},ex:{}};}
async function saveDay(ds,rows,att,ex){const json=JSON.stringify(ser(rows,att,ex));try{await idbSet('day:'+ds,json);}catch{}try{localStorage.setItem(LS+ds,json);}catch{}}
async function loadMonth(y,m){const e={};for(let d=1;d<=dim(y,m);d++){const ds=toDS(y,m,d);const r=await loadDay(ds);e[ds]={rows:r.rows,att:r.att,ex:r.ex};}return e;}
// React App
const {useState,useEffect,useCallback,useRef,createElement:h}=React;

function App(){
const [authed,setAuthed]=useState(!!localStorage.getItem('hw5ren:tok'));
const [driveOk,setDriveOk]=useState(false);
const [view,setView]=useState('month');
const [cy,setCy]=useState(()=>new Date().getFullYear());
const [cm,setCm]=useState(()=>new Date().getMonth());
const [sel,setSel]=useState(today());
const [md,setMd]=useState({});
const [loading,setLoading]=useState(false);
const [theme,setTheme]=useState(()=>localStorage.getItem('hw5ren:theme')||'default');
const nerv=theme==='nerv';
const [rows,setRows]=useState([]);
const [att,setAtt]=useState({personal:new Set(),sick:new Set(),public:new Set()});
const [ex,setEx]=useState({});
const [msg,setMsg]=useState('');
const [modal,setModal]=useState(null);
const [marked,setMarked]=useState(new Set());
const [inp,setInp]=useState('');
const [phw,setPhw]=useState('');
const [attMod,setAttMod]=useState(null);
const [exMod,setExMod]=useState(null);
const [hist,setHist]=useState([]);
const [hi,setHi]=useState(-1);
const [cwHW,setCwHW]=useState(()=>{try{return JSON.parse(localStorage.getItem('hw5ren:customHW')||'[]');}catch{return[];}});
const [showImp,setShowImp]=useState(false);
const [impTxt,setImpTxt]=useState('');
const todayS=today();
const [lastSync,setLastSync]=useState(()=>localStorage.getItem('hw5ren:lastSync')||'');
const selR=useRef(today()),rowsR=useRef([]),attR=useRef({personal:new Set(),sick:new Set(),public:new Set()}),exR=useRef({});
useEffect(()=>{selR.current=sel;},[sel]);
useEffect(()=>{rowsR.current=rows;},[rows]);
useEffect(()=>{attR.current=att;},[att]);
useEffect(()=>{exR.current=ex;},[ex]);

const save=useCallback(async(r,a,e)=>{
const ds=selR.current,rr=r??rowsR.current,aa=a??attR.current,ee=e??exR.current;
await saveDay(ds,rr,aa,ee);
setMd(p=>({...p,[ds]:{rows:rr,att:aa,ex:ee}}));
if(token){try{const keys=(await idbKeys()).filter(k=>k.startsWith('day:2'));const snap={};for(const k of keys){const v=await idbGet(k);if(v)snap[k]=v;}setTimeout(async()=>{try{await saveDrive(snap);setLastSync(todayS);localStorage.setItem('hw5ren:lastSync',todayS);}catch{}},2000);}catch{}}
},[]);

function ph(r,a,e){setHist(p=>{const b=p.slice(0,hi+1);return[...b,{r,a,e}].slice(-30);});setHi(p=>Math.min(p+1,29));}
function undo(){if(hi<=0)return;const s=hist[hi-1];if(!s)return;setRows(s.r);setAtt(s.a);setEx(s.e);setHi(hi-1);save(s.r,s.a,s.e);}
function redo(){if(hi>=hist.length-1)return;const s=hist[hi+1];if(!s)return;setRows(s.r);setAtt(s.a);setEx(s.e);setHi(hi+1);save(s.r,s.a,s.e);}
function upR(fn){setRows(p=>{const n=fn(p);ph(n,att,ex);save(n,att,ex);return n;});}
function upA(fn){setAtt(p=>{const n=fn(p);ph(rows,n,ex);save(rows,n,ex);return n;});}
function upE(fn){setEx(p=>{const n=fn(p);ph(rows,att,n);save(rows,att,n);return n;});}

useEffect(()=>{
if(!authed)return;
(async()=>{
setMsg('☁️ 從 Drive 載入…');
try{
const snap=await loadDrive();
if(snap&&Object.keys(snap).length>0){
let c=0;
for(const[k,v]of Object.entries(snap)){if(k.startsWith('day:2')){const ds=k.replace('day:','');await idbSet('day:'+ds,v);try{localStorage.setItem(LS+ds,v);}catch{}c++;}}
setMsg('✅ Drive 載入 '+c+' 天');setDriveOk(true);
setLastSync(todayS);localStorage.setItem('hw5ren:lastSync',todayS);
}else{setMsg('✅ 就緒');setDriveOk(true);}
}catch{setMsg('⚠️ 本機模式');}
await doLM(cy,cm);
})();
},[authed]);

async function doLM(y,m){setLoading(true);const e=await loadMonth(y,m);setMd(e);setLoading(false);}
useEffect(()=>{if(authed)doLM(cy,cm);},[cy,cm]);

async function openDay(ds){setLoading(true);const r=await loadDay(ds);const ir=r.rows.length?r.rows:[{hwName:'',groupData:{}}];setRows(ir);setAtt(r.att);setEx(r.ex);setSel(ds);setView('day');setLoading(false);setHist([{r:ir,a:r.att,e:r.ex}]);setHi(0);}
function rs(ri,gid){const row=rows[ri];if(!row?.hwName)return'empty';const g=GROUPS.find(g=>g.id===gid);const done=row.groupData?.[gid]??new Set();const es=ex[row.hwName]??new Set();if(!Object.prototype.hasOwnProperty.call(row.groupData||{},gid))return'untouched';if(!done.size&&!es.size)return'allabsent';if(!g.members.filter(m=>!done.has(m)&&!es.has(m)).length)return'complete';return'partial';}
function gm(ri,gid){const row=rows[ri];if(!row)return[];const g=GROUPS.find(g=>g.id===gid);const done=row.groupData?.[gid]??new Set();const es=ex[row.hwName]??new Set();return g.members.filter(m=>!done.has(m)&&!es.has(m));}
function ge(ri,gid){const row=rows[ri];if(!row?.hwName)return[];const g=GROUPS.find(g=>g.id===gid);const done=row.groupData?.[gid]??new Set();const es=ex[row.hwName]??new Set();return g.members.filter(m=>!done.has(m)&&es.has(m));}

function fmt(ds){if(!ds)return'';const[y,m,d]=ds.split('-');const w=new Date(+y,+m-1,+d).getDay();return`${+m}月${+d}日（${WEEKDAYS[w]}）`;}
function prev(){if(cm===0){setCy(y=>y-1);setCm(11);}else setCm(m=>m-1);}
function next(){if(cm===11){setCy(y=>y+1);setCm(0);}else setCm(m=>m+1);}

function ci(ds,d){
const e=md[ds]||{};const r=e.rows||[];const a=e.att||{};const xe=e.ex||{};
const ar=r.filter(r=>r.hwName);
const ac=(a.personal?.size||0)+(a.sick?.size||0)+(a.public?.size||0);
const ok=ar.length>0&&ar.every(r=>GROUPS.every(g=>{const done=r.groupData?.[g.id]??new Set();const es=xe[r.hwName]??new Set();return g.members.every(m=>done.has(m)||es.has(m));}));
const pt=!ok&&ar.some(r=>GROUPS.some(g=>{const done=r.groupData?.[g.id];return done&&done.size>0;}));
const it=ds===todayS;
return h('div',{className:'cc'+(ok?' ok':pt?' pt':'')+(it?' td':''),onClick:()=>openDay(ds),style:{border:'1px solid #e8eef5',padding:'6px 5px',minHeight:68,cursor:'pointer',background:ok?'#f0faf4':pt?'#fff9f0':'#fff',position:'relative',display:'flex',flexDirection:'column'}},
h('span',{style:{fontSize:14,fontWeight:700,color:it?'#fff':'#2d4a6a',background:it?'#1e3a5f':'none',width:it?22:undefined,height:it?22:undefined,borderRadius:it?'50%':undefined,display:it?'flex':undefined,alignItems:it?'center':undefined,justifyContent:it?'center':undefined,fontSize:it?12:14}},d),
ok&&h('span',{style:{position:'absolute',top:5,right:6,color:'#4caf80',fontSize:13,fontWeight:900}},'✓'),
ac>0&&h('span',{style:{fontSize:9,background:'rgba(255,100,0,.15)',color:'#e65100',padding:'1px 4px',borderRadius:4,marginTop:2}},ac+'請')
);}

if(!authed)return h('div',{className:'auth-screen'},
h('div',{className:'auth-logo'},'📋'),
h('h1',{className:'auth-title'},'作業繳交記錄'),
h('p',{className:'auth-sub'},'五年壬班 // 大甲國小'),
h('button',{className:'auth-btn',onClick:()=>signIn().then(()=>setAuthed(true)).catch(e=>setMsg('登入失敗'))},
h('span',{style:{fontWeight:900,fontSize:18}},'G'),'  使用 Google 帳號登入'),
h('p',{className:'auth-note'},'登入後資料自動存到您的 Google Drive\n不需要手動備份')
);

const resMissing=modal?.phase==='result'?gm(modal.ri,modal.gid):[];
const resGrp=GROUPS.find(g=>g.id===modal?.gid);

return h('div',{style:{maxWidth:640,margin:'0 auto',minHeight:'100vh',display:'flex',flexDirection:'column',background:nerv?'#050200':'#f0f4f8',color:nerv?'#ff6600':'inherit'}},

// HEADER
h('div',{style:{background:nerv?'linear-gradient(180deg,#120400,#080200)':'linear-gradient(135deg,#1e3a5f,#2d5a8e)',color:'#fff',padding:'10px 14px 0',position:'sticky',top:0,zIndex:50}},
h('div',{style:{display:'flex',alignItems:'center',gap:8,paddingBottom:8}},
h('span',{style:{fontSize:20}},nerv?'⬡':'📋'),
h('div',{style:{flex:1}},
h('div',{style:{fontSize:15,fontWeight:900,letterSpacing:1}},nerv?'NERV // 作業繳交':'作業繳交記錄'),
h('div',{style:{fontSize:10,opacity:.7}},nerv?'▸ CLASS-05REN ◂':'5年壬班')
),
h('button',{onClick:()=>{const n=nerv?'default':'nerv';localStorage.setItem('hw5ren:theme',n);setTheme(n);},style:{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',padding:'4px 8px',borderRadius:6,fontSize:11,cursor:'pointer',marginRight:4}},nerv?'🔵':'🟠'),
h('button',{onClick:()=>{token=null;localStorage.removeItem('hw5ren:tok');setAuthed(false);},style:{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',padding:'4px 8px',borderRadius:6,fontSize:11,cursor:'pointer'}},nerv?'EXIT':'登出')
),
// Drive status
h('div',{style:{fontSize:10,padding:'3px 0 4px',opacity:.8,display:'flex',alignItems:'center',gap:6}},
h('span',{style:{width:6,height:6,borderRadius:'50%',background:driveOk?'#4caf80':'#aaa',display:'inline-block'}}),
msg||( driveOk?'☁️ Drive 已連線':'⚙️ 初始化中…')
),
// Backup warn
lastSync!==todayS&&h('div',{style:{overflow:'hidden',padding:'5px 0',background:nerv?'#1a0000':'#fff3cd',borderLeft:nerv?'none':'4px solid #ffc107'}},
h('span',{style:{display:'inline-block',whiteSpace:'nowrap',animation:'marquee 14s linear infinite',paddingLeft:'100%',fontSize:11,fontWeight:700,color:nerv?'#ff0000':'#856404'}},
nerv?'⚠ WARNING // 今日尚未同步 Drive // 使徒接近中 ⚠ WARNING // 今日尚未同步 Drive //':'⚠️ 今日尚未同步 Google Drive　請點下方「☁️ 同步」按鈕　⚠️ 今日尚未同步　'
)
),
// Nav
h('div',{style:{display:'flex',alignItems:'center',gap:5,padding:'7px 0 9px',flexWrap:'nowrap'}},
view==='day'&&h('button',{onClick:()=>setView('month'),style:{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',padding:'4px 8px',borderRadius:6,fontSize:11,cursor:'pointer',flexShrink:0}},nerv?'◀':'← 月曆'),
h('button',{onClick:prev,style:{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',width:26,height:26,borderRadius:6,fontSize:15,cursor:'pointer',flexShrink:0}},'‹'),
h('span',{style:{color:'#fff',fontSize:14,fontWeight:800,minWidth:80,textAlign:'center',flexShrink:0}},`${cy} 年 ${cm+1} 月`),
h('button',{onClick:next,style:{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',width:26,height:26,borderRadius:6,fontSize:15,cursor:'pointer',flexShrink:0}},'›'),
view==='day'&&h('span',{style:{color:'rgba(255,255,255,.8)',fontSize:11,flex:1,textAlign:'center',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},fmt(sel)),
view==='day'&&h('div',{style:{display:'flex',gap:3,flexShrink:0}},
h('button',{onClick:undo,disabled:hi<=0,style:{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',width:28,height:28,borderRadius:6,fontSize:14,cursor:'pointer',opacity:hi<=0?.3:1}},'↩'),
h('button',{onClick:redo,disabled:hi>=hist.length-1,style:{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',width:28,height:28,borderRadius:6,fontSize:14,cursor:'pointer',opacity:hi>=hist.length-1?.3:1}},'↪')
)
),
// Sync bar
h('div',{style:{display:'flex',gap:6,padding:'5px 0 6px',flexWrap:'wrap',borderTop:'1px solid rgba(255,255,255,.1)'}},
h('button',{onClick:async()=>{setMsg('⏳ 同步中…');try{const keys=(await idbKeys()).filter(k=>k.startsWith('day:2'));const snap={};for(const k of keys){const v=await idbGet(k);if(v)snap[k]=v;}const ok=await saveDrive(snap);if(ok){setLastSync(todayS);localStorage.setItem('hw5ren:lastSync',todayS);setMsg('✅ 同步完成 '+keys.length+' 天');}else setMsg('❌ 同步失敗');}catch(e){setMsg('❌ '+e.message.slice(0,40));}setTimeout(()=>setMsg(''),5000);},style:{background:'rgba(76,175,128,.5)',border:'none',color:'#fff',padding:'4px 10px',borderRadius:6,fontSize:11,cursor:'pointer'}},'☁️ 立即同步 Drive'),
h('button',{onClick:()=>setShowImp(true),style:{background:'rgba(255,152,0,.5)',border:'none',color:'#fff',padding:'4px 10px',borderRadius:6,fontSize:11,cursor:'pointer'}},'📥 匯入')
)
),

// MONTH VIEW
view==='month'&&h('div',{style:{flex:1,padding:12,overflowY:'auto'}},
loading?h('div',{style:{textAlign:'center',padding:60,color:'#6a8aaa'}},'載入中…'):
h(React.Fragment,null,
h('div',{style:{background:'#f0f4f8',borderRadius:12,overflow:'hidden',marginBottom:16,boxShadow:'0 4px 20px rgba(0,0,0,.08)'}},
h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'#1e3a5f'}},
WEEKDAYS.map(w=>h('div',{key:w,style:{color:'#a8cdf0',fontSize:12,fontWeight:700,textAlign:'center',padding:'10px 0'}},w))
),

h('button',{onClick:async()=>{if(!impTxt.trim())return;setMsg('⏳ 匯入中…');try{const p=JSON.parse(impTxt.trim());let c=0;const dates=[];if(p.date&&p.data){await idbSet('day:'+p.date,p.data);try{localStorage.setItem(LS+p.date,p.data);}catch{}dates.push(p.date);c=1;}else{for(const[k,v]of Object.entries(p)){if(k.startsWith('day:2')){const ds=k.replace('day:','');await idbSet('day:'+ds,v);try{localStorage.setItem(LS+ds,v);}catch{}dates.push(ds);c++;}}}if(dates.length>0){const[y,m]=dates.sort()[0].split('-').map(Number);setCy(y);setCm(m-1);await doLM(y,m-1);}setMsg('✅ 已還原 '+c+' 天');setShowImp(false);setImpTxt('');setView('month');}catch(e){setMsg('❌ '+e.message);}setTimeout(()=>setMsg(''),5000);},style:{padding:'10px 24px',border:'none',borderRadius:12,background:'#1e3a5f',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer'}},'確認匯入')
)
))
);}

// Marquee style
const style=document.createElement('style');
style.textContent='@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}';
document.head.appendChild(style);

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
});
</script>
