<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="作業記錄">
<meta name="theme-color" content="#1e3a5f">
</head>
<body style="margin:0;padding:0;background:#f0f4f8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-user-select:none;user-select:none;width:100vw;height:100vh;overflow:hidden">
  
  <div id="root" style="width:100%;height:100%;display:flex;flex-direction:column;padding:20px;color:#333;">
    正在載入系統核心，若畫面持續全白，請檢查 Safari 是否啟動了無痕模式，或嘗試更新 iOS 系統...
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script>
  // 使用最傳統的 IIFE 封裝，確保作用域隔離且完全不使用任何可能崩潰的新語法
  (function() {
    try {
        // 1. 超級安全的 Storage 防禦
        var safeStorage = {
            getItem: function(key) {
                try { return localStorage.getItem(key); } catch(e) { return null; }
            },
            setItem: function(key, val) {
                try { localStorage.setItem(key, val); } catch(e) {}
            }
        };

        // 2. 靜態資料定義
        var ALL_MEMBERS = [];
        for (var i = 1; i <= 32; i++) { ALL_MEMBERS.push(i); }

        var DB_NAME = "Hw5renRecordsDB";
        var DB_STORE = "records";
        var COUNSEL_PERIODS = ["早自習", "第一節", "第二節", "第三節", "第四節", "午休", "第五節", "第六節", "第七節", "第八節", "放學後"];
        var COUNSEL_TYPES = ["常規輔導", "學習指導", "心理關懷", "衝突調解", "生涯規劃", "家長聯繫", "其他"];
        var COUNSEL_FOLLOWUP = ["觀察", "再約談", "結案"];

        var useState = React.useState;
        var useEffect = React.useEffect;

        // 3. IndexedDB 傳統回呼相容封裝
        function openDB() {
            return new Promise(function(resolve, reject) {
                var req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) {
                        db.createObjectStore(DB_STORE);
                    }
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e.target.error); };
            });
        }

        function idbGet(db, key) {
            return new Promise(function(resolve, reject) {
                var tx = db.transaction(DB_STORE, "readonly");
                var req = tx.objectStore(DB_STORE).get(key);
                req.onsuccess = function() { resolve(req.result); };
                req.onerror = function() { reject(req.onerror); };
            });
        }

        function idbSet(db, key, val) {
            return new Promise(function(resolve, reject) {
                var tx = db.transaction(DB_STORE, "readwrite");
                var req = tx.objectStore(DB_STORE).put(val, key);
                req.onsuccess = function() { resolve(); };
                req.onerror = function() { reject(req.onerror); };
            });
        }

        function idbKeys(db) {
            return new Promise(function(resolve, reject) {
                var tx = db.transaction(DB_STORE, "readonly");
                var req = tx.objectStore(DB_STORE).getAllKeys();
                req.onsuccess = function() { resolve(req.result); };
                req.onerror = function() { reject(req.onerror); };
            });
        }

        function fmtDate(d) {
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1);
            if (m.length < 2) m = '0' + m;
            var date = String(d.getDate());
            if (date.length < 2) date = '0' + date;
            return y + '-' + m + '-' + date;
        }

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirstDayOffset(y, m) { return new Date(y, m, 1).getDay(); }

        // 4. CounselView 組件 (移除所有可能導致舊 Safari 核心死當的複雜箭頭函式與巢狀 Assign)
        function CounselView(props) {
            var date = props.date;
            var records = props.records;
            var onSave = props.onSave;
            var onClose = props.onClose;
            var allMembers = props.allMembers;
            var groups = props.groups;

            var [recs, setRecs] = useState(function() {
                return records && records.length ? JSON.parse(JSON.stringify(records)) : [{ period: "", type: "", students: [], summary: "", followup: "觀察" }];
            });
            var [activeIdx, setActiveIdx] = useState(0);

            function addRec() {
                setRecs(function(p) {
                    return p.concat([{ period: "", type: "", students: [], summary: "", followup: "觀察" }]);
                });
                setActiveIdx(recs.length);
            }

            function delRec(idx) {
                if (recs.length <= 1) {
                    setRecs([{ period: "", type: "", students: [], summary: "", followup: "觀察" }]);
                    setActiveIdx(0);
                } else {
                    setRecs(function(p) {
                        return p.filter(function(_, i) { return i !== idx; });
                    });
                    setActiveIdx(Math.max(0, idx - 1));
                }
            }

            function upd(idx, field, val) {
                setRecs(function(p) {
                    var n = JSON.parse(JSON.stringify(p)); // 徹底用深拷貝取代 Object.assign，防止 Safari 記憶體崩潰
                    n[idx][field] = val;
                    return n;
                });
            }

            function toggleStudent(idx, n) {
                setRecs(function(p) {
                    var next = JSON.parse(JSON.stringify(p));
                    var arr = next[idx].students || [];
                    var pos = arr.indexOf(n);
                    if (pos > -1) {
                        arr.splice(pos, 1);
                    } else {
                        arr.push(n);
                    }
                    arr.sort(function(a, b) { return a - b; });
                    next[idx].students = arr;
                    return next;
                });
            }

            function doSave() {
                var filtered = recs.filter(function(r) {
                    return r.students.length || r.summary || r.type || r.period;
                });
                onSave(filtered);
                onClose();
            }

            var rec = recs[activeIdx] || recs[0];
            var panelStyle = { background: "#fff", borderRadius: "16px", padding: "16px", marginBottom: "12px", boxShadow: "0 4px 20px rgba(0,0,0,.08)" };
            var lblStyle = { fontSize: "12px", fontWeight: "700", color: "#6a8aaa", letterSpacing: "1px", marginBottom: "6px", display: "block" };
            var inpStyle = { width: "100%", padding: "8px 12px", border: "2px solid #dde5ee", borderRadius: "10px", fontSize: "14px", boxSizing: "border-box", outline: "none" };

            return (
                React.createElement("main", { style: { padding: "12px", overflowY: "auto", flex: 1 } },
                    React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "10px", marginBottom: "16px" } },
                        React.createElement("button", { onClick: onClose, style: { background: "rgba(30,58,95,.1)", border: "none", color: "#1e3a5f", padding: "6px 14px", borderRadius: "8px", cursor: "pointer", fontSize: "13px", fontWeight: "700" } }, "← 返回"),
                        React.createElement("span", { style: { fontSize: "16px", fontWeight: "900", color: "#1e3a5f", flex: 1 } }, "💬 輔導紀錄"),
                        React.createElement("span", { style: { fontSize: "12px", color: "#8a9db5" } }, fmtDate(date))
                    ),
                    React.createElement("div", { style: { display: "flex", gap: "6px", marginBottom: "12px", flexWrap: "wrap" } },
                        recs.map(function(r, i) {
                            var isAct = activeIdx === i;
                            return React.createElement("button", { key: i, onClick: function() { setActiveIdx(i); }, style: { padding: "5px 12px", borderRadius: "20px", border: "2px solid", borderColor: isAct ? "#1e3a5f" : "#dde5ee", background: isAct ? "#1e3a5f" : "transparent", color: isAct ? "#fff" : "#8a9db5", fontSize: "12px", fontWeight: "700", cursor: "pointer" } }, "紀錄 " + (i + 1));
                        }),
                        React.createElement("button", { onClick: addRec, style: { padding: "5px 12px", borderRadius: "20px", border: "2px dashed #c3d8ff", background: "transparent", color: "#8a9db5", fontSize: "12px", fontWeight: "700", cursor: "pointer" } }, "+")
                    ),
                    React.createElement("div", { style: panelStyle },
                        React.createElement("label", { style: lblStyle }, "節次"),
                        React.createElement("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px", marginBottom: "14px" } },
                            COUNSEL_PERIODS.map(function(p) {
                                var isSel = rec.period === p;
                                return React.createElement("button", { key: p, onClick: function() { upd(activeIdx, "period", isSel ? "" : p); }, style: { padding: "5px 10px", borderRadius: "8px", border: "2px solid", borderColor: isSel ? "#1e3a5f" : "#dde5ee", background: isSel ? "#e8f0fe" : "transparent", color: isSel ? "#1e3a5f" : "#8a9db5", fontSize: "12px", fontWeight: "700", cursor: "pointer" } }, p);
                            })
                        ),
                        React.createElement("label", { style: lblStyle }, "輔導類別"),
                        React.createElement("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px", marginBottom: "14px" } },
                            COUNSEL_TYPES.map(function(t) {
                                var isSel = rec.type === t;
                                return React.createElement("button", { key: t, onClick: function() { upd(activeIdx, "type", isSel ? "" : t); }, style: { padding: "5px 10px", borderRadius: "8px", border: "2px solid", borderColor: isSel ? "#7c3aed" : "#dde5ee", background: isSel ? "#f3e8ff" : "transparent", color: isSel ? "#7c3aed" : "#8a9db5", fontSize: "12px", fontWeight: "700", cursor: "pointer" } }, t);
                            })
                        ),
                        React.createElement("label", { style: lblStyle }, "學生座號（可多選）"),
                        React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(8,1fr)", gap: "4px", marginBottom: "14px" } },
                            allMembers.map(function(n) {
                                var currStudents = rec.students || [];
                                var isSel = currStudents.indexOf(n) > -1;
                                return React.createElement("button", { key: n, onClick: function() { toggleStudent(activeIdx, n); }, style: { padding: "5px 0", fontSize: "11px", fontWeight: isSel ? "800" : "400", border: "1.5px solid", borderColor: isSel ? "#1e3a5f" : "#dde5ee", borderRadius: "6px", background: isSel ? "#e8f0fe" : "transparent", color: isSel ? "#1e3a5f" : "#aaa", cursor: "pointer" } }, n);
                            })
                        ),
                        React.createElement("label", { style: lblStyle }, "事件摘要（可空白）"),
                        React.createElement("textarea", { value: rec.summary || "", onChange: function(e) { upd(activeIdx, "summary", e.target.value); }, placeholder: "可空白，簡短描述即可", rows: 3, style: Object.assign({}, inpStyle, { resize: "vertical", marginBottom: "14px", lineHeight: 1.6 }) }),
                        React.createElement("label", { style: lblStyle }, "後續處理"),
                        React.createElement("div", { style: { display: "flex", gap: "8px", marginBottom: "6px" } },
                            COUNSEL_FOLLOWUP.map(function(f) {
                                var isSel = rec.followup === f;
                                return React.createElement("button", { key: f, onClick: function() { upd(activeIdx, "followup", isSel ? "" : f); }, style: { flex: 1, padding: "8px 0", borderRadius: "10px", border: "2px solid", borderColor: isSel ? "#f59e0b" : "#dde5ee", background: isSel ? "#fef3c7" : "transparent", color: isSel ? "#b45309" : "#8a9db5", fontSize: "12px", fontWeight: "700", cursor: "pointer" } }, f);
                            })
                        )
                    ),
                    React.createElement("button", { onClick: function() { delRec(activeIdx); }, style: { display: "block", width: "100%", padding: "10px", marginBottom: "12px", background: "transparent", border: "1px solid #ffcdd2", color: "#ef9a9a", borderRadius: "10px", cursor: "pointer", fontSize: "12px", fontWeight: "700" } }, "× 刪除此筆"),
                    React.createElement("button", { onClick: doSave, style: { display: "block", width: "100%", padding: "14px", background: "#1e3a5f", border: "none", color: "#fff", borderRadius: "16px", cursor: "pointer", fontSize: "15px", fontWeight: "900", boxShadow: "0 4px 12px rgba(30,58,95,.25)", marginBottom: "32px" } }, "儲存輔導紀錄")
                )
            );
        }

        // 5. SettingsView 組件
        function SettingsView(props) {
            var onClose = props.onClose;
            var [draftSchool, setDraftSchool] = useState(props.schoolName);
            var [draftYear, setDraftYear] = useState(props.schoolYear);
            var [draftClass, setDraftClass] = useState(props.className);

            function saveAll() {
                props.setSchoolName(draftSchool);
                props.setSchoolYear(draftYear);
                props.setClassName(draftClass);
                onClose();
            }

            var panelStyle = { background: "#fff", borderRadius: "16px", padding: "16px", marginBottom: "14px", boxShadow: "0 4px 20px rgba(0,0,0,.08)" };
            var lblStyle = { fontSize: "12px", fontWeight: "700", color: "#6a8aaa", letterSpacing: "1px", marginBottom: "6px", display: "block" };
            var inpStyle = { width: "100%", padding: "8px 12px", border: "2px solid #dde5ee", borderRadius: "10px", fontSize: "14px", boxSizing: "border-box", outline: "none" };

            return (
                React.createElement("main", { style: { padding: "12px", overflowY: "auto", flex: 1 } },
                    React.createElement("div", { style: { display: "flex", alignItems: "center", gap: "10px", marginBottom: "16px" } },
                        React.createElement("button", { onClick: onClose, style: { background: "rgba(30,58,95,.1)", border: "none", color: "#1e3a5f", padding: "6px 14px", borderRadius: "8px", cursor: "pointer", fontSize: "13px", fontWeight: "700" } }, "← 返回"),
                        React.createElement("span", { style: { fontSize: "16px", fontWeight: "900", color: "#1e3a5f", flex: 1 } }, "⚙️ 系統設定")
                    ),
                    React.createElement("div", { style: panelStyle },
                        React.createElement("label", { style: lblStyle }, "學校名稱"),
                        React.createElement("input", { type: "text", value: draftSchool, onChange: function(e) { setDraftSchool(e.target.value); }, style: inpStyle }),
                        React.createElement("div", { style: { height: "12px" } }),
                        React.createElement("label", { style: lblStyle }, "學年度"),
                        React.createElement("input", { type: "text", value: draftYear, onChange: function(e) { setDraftYear(e.target.value); }, style: inpStyle }),
                        React.createElement("div", { style: { height: "12px" } }),
                        React.createElement("label", { style: lblStyle }, "班級代稱"),
                        React.createElement("input", { type: "text", value: draftClass, onChange: function(e) { setDraftClass(e.target.value); }, style: inpStyle })
                    ),
                    React.createElement("button", { onClick: saveAll, style: { display: "block", width: "100%", padding: "14px", background: "#1e3a5f", border: "none", color: "#fff", borderRadius: "16px", cursor: "pointer", fontSize: "15px", fontWeight: "900", marginBottom: "24px" } }, "儲存設定")
                )
            );
        }

        // 6. App 主組件
        function App() {
            var [db, setDb] = useState(null);
            var [view, setView] = useState("month");
            var [currentDate, setCurrentDate] = useState(new Date());
            
            var [className, setClassNameState] = useState(function() { return safeStorage.getItem("hw5ren:className") || "自訂班級"; });
            var [schoolName, setSchoolNameState] = useState(function() { return safeStorage.getItem("hw5ren:school") || "智慧學校"; });
            var [schoolYear, setSchoolYearState] = useState(function() { return safeStorage.getItem("hw5ren:year") || "115"; });

            var [monthData, setMonthData] = useState({});
            var [counselView, setCounselView] = useState(false);
            var [counselDate, setCounselDate] = useState(null);
            var [counselRecords, setCounselRecords] = useState([]);

            function setClassName(v) { setClassNameState(v); safeStorage.setItem("hw5ren:className", v); }
            function setSchoolName(v) { setSchoolNameState(v); safeStorage.setItem("hw5ren:school", v); }
            function setSchoolYear(v) { setSchoolYearState(v); safeStorage.setItem("hw5ren:year", v); }

            useEffect(function() {
                openDB().then(function(database) {
                    setDb(database);
                    loadMonthData(database, currentDate);
                }).catch(function(err) { console.error(err); });
            }, []);

            function loadMonthData(database, date) {
                if (!database) return;
                idbKeys(database).then(function(keys) {
                    var prefix = fmtDate(date).slice(0, 7);
                    var targets = keys.filter(function(k) { return k.indexOf(prefix) === 0; });
                    var promises = targets.map(function(k) {
                        return idbGet(database, k).then(function(v) { return { key: k, val: v }; });
                    });
                    Promise.all(promises).then(function(results) {
                        var mapped = {};
                        results.forEach(function(r) { mapped[r.key] = r.val; });
                        setMonthData(mapped);
                    });
                });
            }

            function changeMonth(offset) {
                var n = new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1);
                setCurrentDate(n);
                loadMonthData(db, n);
            }

            function clickDay(d) {
                var key = fmtDate(d);
                var recs = monthData[key] || [];
                setCounselDate(d);
                setCounselRecords(recs);
                setCounselView(true);
            }

            function saveCounselRecord(filteredRecs) {
                var key = fmtDate(counselDate);
                idbSet(db, key, filteredRecs).then(function() {
                    setMonthData(function(p) {
                        var next = Object.assign({}, p);
                        next[key] = filteredRecs;
                        return next;
                    });
                });
            }

            var year = currentDate.getFullYear();
            var month = currentDate.getMonth();
            var daysInMonth = getDaysInMonth(year, month);
            var offset = getFirstDayOffset(year, month);
            var cells = [];

            for (var i = 0; i < offset; i++) cells.push(null);
            for (var d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

            return (
                React.createElement("div", { style: { display: "flex", flexDirection: "column", height: "100%", background: "#f0f4f8" } },
                    React.createElement("header", { style: { background: "#1e3a5f", color: "#fff", padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" } },
                        React.createElement("div", null,
                            React.createElement("div", { style: { fontSize: "11px", opacity: 0.7, letterSpacing: "1px" } }, schoolYear + "學年 · " + schoolName),
                            React.createElement("div", { style: { fontSize: "18px", fontWeight: "900", marginTop: "2px" } }, className)
                        ),
                        React.createElement("button", { onClick: function() { setView(view === "settings" ? "month" : "settings"); }, style: { background: "rgba(255,200,200,0.1)", border: "none", color: "inherit", padding: "8px 12px", borderRadius: "8px", fontSize: "13px", cursor: "pointer" } }, "設定")
                    ),
                    view === "month" && !counselView && React.createElement("div", { style: { padding: "12px", flex: 1, display: "flex", flexDirection: "column" } },
                        React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" } },
                            React.createElement("button", { onClick: function() { changeMonth(-1); }, style: { padding: "10px", background: "none", border: "none", cursor: "pointer", fontSize: "16px" } }, "◀"),
                            React.createElement("h2", { style: { margin: 0, fontSize: "18px", fontWeight: "900", color: "#1e3a5f" } }, year + "年 " + (month + 1) + "月"),
                            React.createElement("button", { onClick: function() { changeMonth(1); }, style: { padding: "10px", background: "none", border: "none", cursor: "pointer", fontSize: "16px" } }, "▶")
                        ),
                        React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "4px", flex: 1 } },
                            cells.map(function(cell, idx) {
                                if (!cell) return React.createElement("div", { key: "empty-" + idx });
                                var key = fmtDate(cell);
                                var hasData = monthData[key] && monthData[key].length > 0;
                                return React.createElement("button", {
                                    key: key,
                                    onClick: function() { clickDay(cell); },
                                    style: {
                                        background: hasData ? "#e8f0fe" : "#fff",
                                        border: "1px solid #dde5ee",
                                        borderRadius: "12px",
                                        padding: "8px",
                                        display: "flex",
                                        flexDirection: "column",
                                        alignItems: "center",
                                        cursor: "pointer"
                                    }
                                }, 
                                    React.createElement("span", { style: { fontSize: "14px", fontWeight: "700" } }, cell.getDate()),
                                    hasData && React.createElement("span", { style: { width: "6px", height: "6px", background: "#1e3a5f", borderRadius: "50%", marginTop: "4px" } })
                                );
                            })
                        )
                    ),
                    counselView && React.createElement(CounselView, { date: counselDate, records: counselRecords, onSave: saveCounselRecord, onClose: function() { setCounselView(false); }, allMembers: ALL_MEMBERS, groups: [], fmtDate: fmtDate }),
                    view === "settings" && React.createElement(SettingsView, { className: className, setClassName: setClassName, schoolName: schoolName, setSchoolName: setSchoolName, schoolYear: schoolYear, setSchoolYear: setSchoolYear, onClose: function() { setView("month"); } })
                )
            );
        }

        // 7. 安全掛載與啟動
        var rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(React.createElement(App));
        }
    } catch(e) {
        var root = document.getElementById('root');
        if (root) {
            root.innerHTML = '<div style="padding:20px;font-family:monospace;font-size:14px;color:#d32f2f;background:#ffebee;margin:10px;border-radius:8px;"><h3>⚠️ 系統異常提示</h3><p>' + String(e) + '</p></div>';
        }
    }
  })();
  </script>
</body>
</html>
