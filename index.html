<body style="margin:0;padding:0;background:#f0f4f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;width:100vw;height:100vh;overflow:hidden">
  <div id="root" style="width:100%;height:100%;display:flex;flex-direction:column"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script>
  try {
    // ── 安全快取機制包裝（防止 Safari 無痕模式崩潰） ───────────────────
    const safeStorage = {
        getItem: (key) => {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        },
        setItem: (key, value) => {
            try { localStorage.setItem(key, value); } catch (e) { console.warn("Storage is disabled", e); }
        }
    };

    // ── 系統靜態資料與配置 ──────────────────────────────────────────
    const ALL_MEMBERS = Array.from({length:32}, (_,i)=>i+1);
    const DB_NAME = "Hw5renRecordsDB";
    const DB_STORE = "records";
    const COUNSEL_PERIODS = ["早自習", "第一節", "第二節", "第三節", "第四節", "午休", "第五節", "第六節", "第七節", "第八節", "放學後"];
    const COUNSEL_TYPES = ["常規輔導", "學習指導", "心理關懷", "衝突調解", "生涯規劃", "家長聯繫", "其他"];
    const COUNSEL_FOLLOWUP = ["觀察", "再約談", "結案"];

    const { useState, useEffect } = React;

    // ── IndexedDB 資料庫控制封裝 ────────────────────────────────────
    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
            };
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e.target.error);
        });
    }

    function idbGet(db, key) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, "readonly");
            const req = tx.objectStore(DB_STORE).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.onerror);
        });
    }

    function idbSet(db, key, val) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, "readwrite");
            const req = tx.objectStore(DB_STORE).put(val, key);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.onerror);
        });
    }

    function idbKeys(db) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, "readonly");
            const req = tx.objectStore(DB_STORE).getAllKeys();
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.onerror);
        });
    }

    // ── 日期格式化與算圖輔助 ────────────────────────────────────────
    function fmtDate(d) {
        const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), date = String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${date}`;
    }

    function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
    function getFirstDayOffset(y, m) { return new Date(y, m, 1).getDay(); }

    // ── 輔導紀錄視窗組件 (CounselView) ──────────────────────────────
    function CounselView({ date, records, onSave, onClose, isNerv, allMembers, groups, fmtDate }) {
        const [recs, setRecs] = useState(() => {
            return records.length ? JSON.parse(JSON.stringify(records)) : [{ period: "", type: "", students: [], summary: "", followup: "觀察" }];
        });
        const [activeIdx, setActiveIdx] = useState(0);

        function addRec() {
            setRecs(p => [...p, { period: "", type: "", students: [], summary: "", followup: "觀察" }]);
            setActiveIdx(recs.length);
        }

        function delRec(idx) {
            if (recs.length <= 1) {
                setRecs([{ period: "", type: "", students: [], summary: "", followup: "觀察" }]);
                setActiveIdx(0);
            } else {
                setRecs(p => p.filter((_, i) => i !== idx));
                setActiveIdx(Math.max(0, idx - 1));
            }
        }

        function upd(idx, field, val) {
            setRecs(p => {
                const n = [...p];
                // 修正：在 Safari 底下避免重複使用過深的 Object.assign
                n[idx] = { ...n[idx], [field]: val };
                return n;
            });
        }

        function toggleStudent(idx, n) {
            setRecs(p => {
                const next = [...p];
                const s = new Set(next[idx].students || []);
                if (s.has(n)) s.delete(n); else s.add(n);
                next[idx] = { ...next[idx], students: [...s].sort((a, b) => a - b) };
                return next;
            });
        }

        function doSave() {
            const filtered = recs.filter(r => r.students.length || r.summary || r.type || r.period);
            onSave(filtered);
            onClose();
        }

        const nerv = isNerv;
        const panel = nerv ? { background: "#080200", border: "1px solid #ff6600", borderRadius: 4, padding: 16, marginBottom: 12 } : { background: "#fff", borderRadius: 16, padding: 16, marginBottom: 12, boxShadow: "0 4px 20px rgba(0,0,0,.08)" };
        const lbl = nerv ? { color: "#ff6600", fontFamily: "Share Tech Mono,monospace", fontSize: 11, letterSpacing: 2, marginBottom: 6, display: "block" } : { fontSize: 12, fontWeight: 700, color: "#6a8aaa", letterSpacing: 1, marginBottom: 6, display: "block" };
        const inp = nerv ? { width: "100%", padding: "8px 10px", background: "rgba(255,102,0,.06)", border: "1px solid rgba(255,102,0,.4)", color: "#ff8844", borderRadius: 2, fontSize: 14, fontFamily: "Share Tech Mono,monospace", boxSizing: "border-box" } : { width: "100%", padding: "8px 12px", border: "2px solid #dde5ee", borderRadius: 10, fontSize: 14, fontFamily: "inherit", boxSizing: "border-box", outline: "none" };
        const rec = recs[activeIdx] || recs[0];

        return (
            React.createElement("main", { style: { padding: 12, overflowY: "auto", flex: 1 } },
                React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 16 } },

                        })

                    React.createElement("textarea", { value: rec.summary || "", onChange: e => upd(activeIdx, "summary", e.target.value), placeholder: nerv ? "[ INPUT OPTIONAL ]" : "可空白，簡短描述即可", rows: 3, style: { ...inp, resize: "vertical", marginBottom: 14, lineHeight: 1.6 } }),
                    React.createElement("label", { style: lbl }, nerv ? "// FOLLOW-UP //" : "後續處理"),
                    React.createElement("div", { style: { display: "flex", gap: 8, marginBottom: 6 } },
                        COUNSEL_FOLLOWUP.map(f => React.createElement("button", { key: f, onClick: () => upd(activeIdx, "followup", rec.followup === f ? "" : f), style: { flex: 1, padding: "8px 0", borderRadius: nerv ? 2 : 10, border: nerv ? "1px solid" : "2px solid", borderColor: rec.followup === f ? (nerv ? "#ffcc00" : "#f59e0b") : (nerv ? "rgba(255,102,0,.3)" : "#dde5ee"), background: rec.followup === f ? (nerv ? "rgba(255,204,0,.15)" : "#fef3c7") : "transparent", color: rec.followup === f ? (nerv ? "#ffcc00" : "#b45309") : (nerv ? "rgba(255,102,0,.5)" : "#8a9db5"), fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: nerv ? "Share Tech Mono,monospace" : "inherit" } }, f))

                ),

                React.createElement("button", { onClick: doSave, style: { display: "block", width: "100%", padding: 14, background: nerv ? "rgba(255,102,0,.15)" : "#1e3a5f", border: nerv ? "1px solid #ff6600" : "none", color: nerv ? "#ff6600" : "#fff", borderRadius: nerv ? 4 : 16, cursor: "pointer", fontSize: 15, fontWeight: 900, letterSpacing: nerv ? 3 : 1, fontFamily: nerv ? "Share Tech Mono,monospace" : "inherit", boxShadow: nerv ? "0 0 12px rgba(255,102,0,.3)" : "0 4px 12px rgba(30,58,95,.25)", marginBottom: 32 } }, nerv ? "// SAVE LOG //" : "儲存輔導紀錄")
            )
        );
    }

    // ── 設定視窗組件 (SettingsView) ───────────────────────────────
    function SettingsView({ groups, saveGroups, className, setClassName, schoolName, setSchoolName, schoolYear, setSchoolYear, onClose, isNerv, idbKeys, idbGet, openDB, DB_STORE }) {

        const [draftClass, setDraftClass] = useState(className);
        const [draftSchool, setDraftSchool] = useState(schoolName);
        const [draftYear, setDraftYear] = useState(schoolYear);
        const [importMsg, setImportMsg] = useState("");

        function saveAll() {
            setClassName(draftClass);
            setSchoolName(draftSchool);
            setSchoolYear(draftYear);
            saveGroups(draft);
            onClose();
        }

        const nerv = isNerv;
        const panel = nerv ? { background: "#080200", border: "1px solid #ff6600", borderRadius: 4, padding: 16, marginBottom: 14 } : { background: "#fff", borderRadius: 16, padding: 16, marginBottom: 14, boxShadow: "0 4px 20px rgba(0,0,0,.08)" };

    // ── 應用程式主進入點組件 (App) ─────────────────────────────────
    function App() {
        const [db, setDb] = useState(null);
        const [view, setView] = useState("month");
        const [currentDate, setCurrentDate] = useState(new Date());
        const [className, setClassName] = useState(() => safeStorage.getItem("hw5ren:className") || "自訂班級");
        const [schoolName, setSchoolName] = useState(() => safeStorage.getItem("hw5ren:school") || "智慧學校");
        const [schoolYear, setSchoolYear] = useState(() => safeStorage.getItem("hw5ren:year") || "115");
        const [groups, setGroups] = useState(() => {
            const saved = safeStorage.getItem("hw5ren:groups");
            return saved ? JSON.parse(saved) : [];
        });

        const [monthData, setMonthData] = useState({});
        const [counselView, setCounselView] = useState(false);
        const [counselDate, setCounselDate] = useState(null);
        const [counselRecords, setCounselRecords] = useState([]);
        const [isNerv, setIsNerv] = useState(false);

        useEffect(() => {
            openDB().then(database => {
                setDb(database);
                loadMonthData(database, currentDate);
            }).catch(err => console.error("IndexedDB 初始化失敗", err));
        }, []);

        function loadMonthData(database, date) {
            if (!database) return;
            idbKeys(database).then(keys => {
                const prefix = fmtDate(date).slice(0, 7); // "YYYY-MM"
                const targets = keys.filter(k => k.startsWith(prefix));
                const promises = targets.map(k => idbGet(database, k).then(v => ({ key: k, val: v })));
                Promise.all(promises).then(results => {
                    const mapped = {};
                    results.forEach(r => { mapped[r.key] = r.val; });
                    setMonthData(mapped);
                });
            });
        }

        function changeMonth(offset) {
            const n = new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1);
            setCurrentDate(n);
            loadMonthData(db, n);
        }

        function clickDay(d) {
            const key = fmtDate(d);
            const recs = monthData[key] || [];
            setCounselDate(d);
            setCounselRecords(recs);
            setCounselView(true);
        }

        function saveCounselRecord(filteredRecs) {
            const key = fmtDate(counselDate);
            idbSet(db, key, filteredRecs).then(() => {
                setMonthData(p => ({ ...p, [key]: filteredRecs }));
            });
        }

        function saveGroups(newGroups) {
            setGroups(newGroups);
            safeStorage.setItem("hw5ren:groups", JSON.stringify(newGroups));
        }

        // ── 渲染日曆網格邏輯 ──────────────────────────────────────────
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const daysInMonth = getDaysInMonth(year, month);
        const offset = getFirstDayOffset(year, month);
        const cells = [];

        for (let i = 0; i < offset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

        return (
            React.createElement("div", { style: { display: "flex", flexDirection: "column", height: "100%", background: isNerv ? "#000" : "#f0f4f8" } },
                React.createElement("header", { style: { background: isNerv ? "#0d0402" : "#1e3a5f", color: isNerv ? "#ff6600" : "#fff", padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: isNerv ? "2px solid #ff6600" : "none" } },
                    React.createElement("div", null,
                        React.createElement("div", { style: { fontSize: 11, opacity: 0.7, letterSpacing: 1 } }, `${schoolYear}學年 · ${schoolName}`),
                        React.createElement("div", { style: { fontSize: 18, fontWeight: 900, marginTop: 2 } }, className)
                    ),
                    React.createElement("button", { onClick: () => setView(view === "settings" ? "month" : "settings"), style: { background: "rgba(255,200,200,0.1)", border: "none", color: "inherit", padding: "8px 12px", borderRadius: 8, fontSize: 13, cursor: "pointer" } }, "設定")
                ),
                view === "month" && !counselView && React.createElement("div", { style: { padding: 12, flex: 1, display: "flex", flexDirection: "column" } },
                    React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 } },
                        React.createElement("button", { onClick: () => changeMonth(-1), style: { padding: 10, background: "none", border: "none", cursor: "pointer", fontSize: 16 } }, "◀"),
                        React.createElement("h2", { style: { margin: 0, fontSize: 18, fontWeight: 900, color: isNerv ? "#ff6600" : "#1e3a5f" } }, `${year}年 ${month+1}月`),
                        React.createElement("button", { onClick: () => changeMonth(1), style: { padding: 10, background: "none", border: "none", cursor: "pointer", fontSize: 16 } }, "▶")
                    ),
                    React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, flex: 1 } },
                        cells.map((cell, idx) => {
                            if (!cell) return React.createElement("div", { key: `empty-${idx}` });
                            const key = fmtDate(cell);
                            const hasData = monthData[key] && monthData[key].length > 0;
                            return React.createElement("button", {
                                key: key,
                                onClick: () => clickDay(cell),
                                style: {
                                    background: hasData ? "#e8f0fe" : "#fff",
                                    border: "1px solid #dde5ee",
                                    borderRadius: 12,
                                    padding: 8,
                                    display: "flex",
                                    flexDirection: "column",
                                    alignItems: "center",
                                    cursor: "pointer"
                                }
                            }, 
                                React.createElement("span", { style: { fontSize: 14, fontWeight: 700 } }, cell.getDate()),
                                hasData && React.createElement("span", { style: { width: 6, height: 6, background: "#1e3a5f", borderRadius: "50%", marginTop: 4 } })
                            );
                        })
                    )
                ),
                counselView && React.createElement(CounselView, { date: counselDate, records: counselRecords, onSave: saveCounselRecord, onClose: () => setCounselView(false), isNerv: isNerv, allMembers: ALL_MEMBERS, groups: groups, fmtDate: fmtDate }),
                view === "settings" && React.createElement(SettingsView, { groups: groups, saveGroups: saveGroups, className: className, setClassName: setClassName, schoolName: schoolName, setSchoolName: setSchoolName, schoolYear: schoolYear, setSchoolYear: setSchoolYear, onClose: () => setView("month"), isNerv: isNerv, idbKeys: idbKeys, idbGet: idbGet, openDB: openDB, DB_STORE: DB_STORE })
            );
        }

        // ── 啟動 React 渲染流程 ──────────────────────────────────────
        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(React.createElement(App));
        }
    } catch(e) {
        const root = document.getElementById('root');
        if (root) {
            root.innerHTML = '<div style="padding:20px;font-family:monospace;font-size:14px;color:#d32f2f;background:#ffebee;margin:10px;border-radius:8px;"><h3>⚠️ 系統啟動失敗 (系統核心異常)</h3><p>' + String(e) + '</p></div>';
        }
    }
  </script>
