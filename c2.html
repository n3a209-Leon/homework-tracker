                    if (v) {
                        try {
                            await idbSet("day:"+ds, v);
                            rescued++;
                        }
                        catch (_b) { }
                    }
                }
                idbDays = (await idbKeys()).filter(k => k.startsWith("day:2"));
                setStor({ state: "ok", msg: "✅ 已搶救 "+rescued+" 天資料到 IDB", detail: "IDB: "+idbDays.length+" 天" });
                return;
            }
            setStor({
                state: "ok",
                msg: "📦 IDB 正常 — "+idbDays.length+" 天資料",
                detail: idbDays.length > 0
                    ? "最近: "+idbDays.map(function(k){return k.replace("day:","");}).sort().slice(-3).join(", ")
                    : "尚無資料，請開始登記"
            });
        })();
    }, []);
    // ── Load month ──
    useEffect(() => { doLoadMonth(curYear, curMonth); }, [curYear, curMonth]);
    async function doLoadMonth(y, m) {
        setLoading(true);
        const [entries, counselEntries] = await Promise.all([
            loadMonth(y, m),
            loadCounselMonth(y, m)
        ]);
        setMonthDays(entries);
        setCounselMonth(counselEntries);
        setLoading(false);
    }
    async function openCounsel(ds) {
        const recs = await loadCounsel(ds);
        setCounselRecords(recs);
        setCounselDate(ds);
        setCounselView(true);
    }
    async function saveCounselRecord(records) {
        await saveCounsel(counselDate, records);
        setCounselRecords(records);
        setCounselMonth(prev => {
            const next = Object.assign({}, prev);
            if (records.length > 0)
                next[counselDate] = records;
            else
                delete next[counselDate];
            return next;
        });
        scheduleAutoSync();
    }
    async function openDay(ds) {
        setLoading(true);
        const res = await loadDay(ds);
        const initRows = res.rows.length ? res.rows : [{ hwName: "", groupData: {} }];
        setDayRows(initRows);
        setDayAtt(res.attendance);
        setDayExempt(res.exempt || {});
        setSelDate(ds);
        setView("day");
        setLoading(false);
        setHistory([{ rows: initRows, att: res.attendance, exempt: res.exempt || {} }]);
        setHistoryIdx(0);
    }
    // ── Undo / Redo history ──
    const [history, setHistory] = useState([]); // [{ rows, att }, ...]
    const [historyIdx, setHistoryIdx] = useState(0); // current position
    const MAX_HISTORY = 30;
    function pushHistory(rows, att, exempt) {
        setHistory(prev => {
            const base = prev.slice(0, historyIdx + 1);
            const next = [...base, { rows, att, exempt }].slice(-MAX_HISTORY);
            return next;
        });
        setHistoryIdx(prev => Math.min(prev + 1, MAX_HISTORY - 1));
    }
    function undo() {
        if (historyIdx <= 0)
            return;
        const idx = historyIdx - 1;
        const snap = history[idx];
        if (!snap)
            return;
        setDayRows(snap.rows);
        setDayAtt(snap.att);
        setDayExempt(snap.exempt || {});
        setHistoryIdx(idx);
        saveCurrent(snap.rows, snap.att, snap.exempt || {});
    }
    function redo() {
        if (historyIdx >= history.length - 1)
            return;
        const idx = historyIdx + 1;
        const snap = history[idx];
        if (!snap)
            return;
        setDayRows(snap.rows);
        setDayAtt(snap.att);
        setDayExempt(snap.exempt || {});
        setHistoryIdx(idx);
        saveCurrent(snap.rows, snap.att, snap.exempt || {});
    }
    const canUndo = historyIdx > 0;
    const canRedo = historyIdx < history.length - 1;
    const selDateRef = useRef(today());
    useEffect(() => { selDateRef.current = selDate; }, [selDate]);
    const dayExemptRef = useRef({});
    useEffect(() => { dayExemptRef.current = dayExempt; }, [dayExempt]);
    const dayAttRef = useRef({ personal: new Set(), sick: new Set(), public: new Set() });
    useEffect(() => { dayAttRef.current = dayAtt; }, [dayAtt]);
    const dayRowsRef = useRef([]);
    useEffect(() => { dayRowsRef.current = dayRows; }, [dayRows]);
    // ── 自動同步 Timer（debounce 3秒）──
    const autoSyncTimer = useRef(null);
    function scheduleAutoSync() {
        if (!authed)
            return;
        if (autoSyncTimer.current)
            clearTimeout(autoSyncTimer.current);
        autoSyncTimer.current = setTimeout(async () => {
            try {
                const allIdbKeys = await idbKeys();
                const keys = allIdbKeys.filter(k => k.startsWith("day:2") || k.startsWith("counsel:"));
                const snap = {};
                for (const k of keys) {
                    const v = await idbGet(k);
                    if (v)
                        snap[k] = v;
                }
                const ok = await saveDrive(snap);
                if (ok) {
                    setDriveStatus("ok");
                    markSynced();
                }
                else {
                    setDriveStatus("error");
                }
            }
            catch (_a) {
                setDriveStatus("error");
            }
        }, 3000);
    document.getElementById('r').innerHTML='<div style="color:#8f8;padding:20px">✅ Chunk 2/4 通過 (L452-902)</div>';
  }catch(e){
    document.getElementById('r').innerHTML='<div style="color:#f88;padding:20px">❌ Chunk 2 執行錯誤<br>'+e.message+'<br>'+(e.stack||'').slice(0,200)+'</div>';
  }
});
</script>
</body></html>
