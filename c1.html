    // 每次開啟 clearModal 時同步最新的 draftClass
    useEffect(() => {
        if (clearModal) {
            setClearInput(p => (Object.assign(Object.assign({}, p), { className: draftClass || className || "", yearFrom: parseInt(draftYear || schoolYear) || new Date().getFullYear(), yearTo: (parseInt(draftYear || schoolYear) || new Date().getFullYear()) + 1 })));
            setClearDel("");
            setClearMsg("");
        }
    }, [clearModal]);
    const nerv = isNerv;
    // 全班最大座號（自動偵測或預設40）
    const maxSeat = 40;
    const allUsed = draft.flatMap(g => g.members);
    function toggleSeat(idx, n) {
        setDraft(prev => {
            const next = JSON.parse(JSON.stringify(prev));
            const g = next[idx];
            if (g.members.includes(n)) {
                g.members = g.members.filter(m => m !== n);
                if (g.leader === n)
                    g.leader = g.members[0] || 0;
                if (g.secretary === n)
                    g.secretary = g.members[1] || g.members[0] || 0;
            }
            else {
                // 確認沒有在其他組
                const inOther = next.some((og, oi) => oi !== idx && og.members.includes(n));
                if (inOther)
                    return prev; // 不能加入已在其他組的座號
                g.members = [...g.members, n].sort((a, b) => a - b);
            }
            return next;
        });
    }
    function updateGroup(idx, field, value) {
        setDraft(prev => {
            const next = JSON.parse(JSON.stringify(prev));
            next[idx][field] = value;
            return next;
        });
    }
    function addGroup() {
        if (draft.length >= 8)
            return;
        const newId = draft.length + 1;
        setDraft(prev => [...prev, { id: newId, label: "第"+KANJI_NUM[prev.length]+"組", members: [], leader: 0, secretary: 0 }]);
    }
    function removeGroup(idx) {
        if (draft.length <= 2)
            return;
        setDraft(prev => prev.filter((_, i) => i !== idx).map((g, i) => (Object.assign(Object.assign({}, g), { id: i + 1 }))));
    }
    function doSave() {
        const valid = draft.every(g => g.members.length > 0);
        if (!valid) {
            alert("每組至少需要1個座號");
            return;
        }
        saveGroups(draft);
        setClassName(draftClass.trim());
        setSchoolName(draftSchool.trim());
        setSchoolYear(draftYear.trim());
        setSaved(true);
        setTimeout(() => { setSaved(false); onClose(); }, 1200);
    }
    async function doClear() {
        if (clearDel !== "DEL") {
            setClearMsg("請輸入正確的 DEL");
            return;
        }
        try {
            const keys = (await idbKeys()).filter(k => k.startsWith("day:2"));
            const db = await openDB();
            await new Promise((res, rej) => {
                const tx = db.transaction(DB_STORE, "readwrite"), st = tx.objectStore(DB_STORE);
                keys.forEach(k => st.delete(k));
                tx.oncomplete = () => res();
                tx.onerror = e => rej(e);
            });
            keys.forEach(k => { try {
                localStorage.removeItem("hw5ren:"+k.replace("day:",""));
            }
            catch (_a) { } });
    document.getElementById('r').innerHTML='<div style="color:#8f8;padding:20px">✅ Chunk 1/4 通過 (L1-451)</div>';
  }catch(e){
    document.getElementById('r').innerHTML='<div style="color:#f88;padding:20px">❌ Chunk 1 執行錯誤<br>'+e.message+'<br>'+(e.stack||'').slice(0,200)+'</div>';
  }
});
</script>
</body></html>
